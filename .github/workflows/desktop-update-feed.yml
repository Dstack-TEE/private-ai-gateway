name: Publish desktop update feed

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: desktop-update-feed-${{ contains(inputs.tag || github.event.release.tag_name, '-beta.') && 'beta' || 'stable' }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.tag != '' || startsWith(github.event.release.tag_name, 'desktop-v')
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install release tooling
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
      - name: Validate and advance the selected channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/publish-update-feed.mjs
