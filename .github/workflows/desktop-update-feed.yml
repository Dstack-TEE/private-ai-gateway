name: Publish desktop update feed

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published desktop release tag to promote
        required: true
        type: string

permissions:
  contents: write

# One group per channel: GitHub keeps only one pending run per group, so a
# shared group could drop a queued publish. A stable publish also writes the
# beta feed's latest.json; if it overlaps a beta publish, the later upload
# stands until the next release advances the feed.
concurrency:
  group: desktop-update-feed-${{ contains(inputs.tag, '-beta.') && 'beta' || 'stable' }}
  cancel-in-progress: false

jobs:
  publish:
    environment: desktop-release
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install release tooling
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
      # The script is idempotent: it re-reads both feeds and uploads only what
      # is still behind. After a transient GitHub API or asset upload failure,
      # use "Re-run failed jobs" on the release run, which also runs the npm
      # publish that was skipped (see distribution.md).
      - name: Validate and advance the selected channel
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/publish-update-feed.mjs
