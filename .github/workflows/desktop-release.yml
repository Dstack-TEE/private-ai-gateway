name: Desktop stable release

run-name: Desktop v${{ inputs.version }} (App Store build ${{ inputs.app_store_build_number }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable desktop and Mac App Store marketing version (for example 0.1.5)
        required: true
        type: string
      app_store_build_number:
        description: Increasing Mac App Store CFBundleVersion (for example 15)
        required: true
        type: string
      release_summary:
        description: Markdown bullets or paragraphs for What's changed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-stable-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install release tooling
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
      - name: Validate coordinated release
        working-directory: apps/desktop
        env:
          APP_STORE_BUILD_NUMBER: ${{ inputs.app_store_build_number }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SUMMARY: ${{ inputs.release_summary }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e '
            import { validateAppStoreBuildNumber } from "./scripts/distribution.mjs";
            import { validateReleaseRequest } from "./scripts/release-channel.mjs";
            validateReleaseRequest({
              version: process.env.RELEASE_VERSION,
              channel: "stable",
              platforms: "all",
              ref: process.env.RELEASE_REF,
              publish: true,
              summary: process.env.RELEASE_SUMMARY,
            });
            validateAppStoreBuildNumber(process.env.APP_STORE_BUILD_NUMBER);
          '

  mac-app-store:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-mac-app-store.yml
    with:
      version: ${{ inputs.version }}
      build_number: ${{ inputs.app_store_build_number }}
      upload: true
    secrets: inherit

  direct:
    needs: mac-app-store
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/desktop-native.yml
    with:
      release_version: ${{ inputs.version }}
      release_channel: stable
      release_summary: ${{ inputs.release_summary }}
      release_platforms: all
      publish_release: true
      package_only: false
    secrets: inherit
