name: Desktop Mac App Store

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-mac-app-store.yml'
      - 'apps/desktop/**'
      - 'crates/aci-protocol/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/desktop-mac-app-store.yml'
      - 'apps/desktop/**'
      - 'crates/aci-protocol/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Mac App Store marketing version (for example 0.1.2)'
        required: true
        type: string
      build_number:
        description: 'Increasing CFBundleVersion (for example 123 or 123.1)'
        required: true
        type: string
      upload:
        description: 'Upload the signed package to App Store Connect'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target

concurrency:
  group: desktop-mac-app-store-${{ github.ref }}-${{ inputs.build_number || 'verify' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}/*/.fingerprint
            ${{ env.CARGO_TARGET_DIR }}/*/deps
            ${{ env.CARGO_TARGET_DIR }}/*/build
          key: pap-mas-verify-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json', 'apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/gateway/Cargo.toml', 'apps/desktop/runtime/Cargo.toml', 'crates/aci-protocol/Cargo.toml') }}
          restore-keys: pap-mas-verify-${{ runner.os }}-
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: |
          xcodebuild -version
          npm ci
      - name: Stage Tauri sidecars
        working-directory: apps/desktop
        env:
          PAP_DISTRIBUTION: mac-app-store
        run: npm run build:sidecars:debug
      - name: Verify App Store sources
        working-directory: apps/desktop
        run: |
          npm run check
          npm run test:release
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --all-targets --package private-ai-proxy-runtime --features mac-app-store -- -D warnings
          cargo test --locked --package private-ai-proxy-runtime --features mac-app-store
          export TAURI_CONFIG="$(cat src-tauri/tauri.appstore.conf.json)"
          cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml --features mac-app-store -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features mac-app-store

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: macos-26
    timeout-minutes: 120
    environment: mac-app-store
    env:
      APPLE_APP_STORE_BUILD_NUMBER: ${{ inputs.build_number }}
      DESKTOP_RELEASE_CHANNEL: stable
      DESKTOP_RELEASE_VERSION: ${{ inputs.version }}
      UPLOAD_APP_STORE: ${{ inputs.upload }}
      APPLE_APPLICATION_IDENTITY: ${{ vars.MAC_APP_STORE_APPLICATION_IDENTITY }}
      APPLE_INSTALLER_IDENTITY: ${{ vars.MAC_APP_STORE_INSTALLER_IDENTITY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}/*/.fingerprint
            ${{ env.CARGO_TARGET_DIR }}/*/deps
            ${{ env.CARGO_TARGET_DIR }}/*/build
            ${{ env.CARGO_TARGET_DIR }}/*/*/.fingerprint
            ${{ env.CARGO_TARGET_DIR }}/*/*/deps
            ${{ env.CARGO_TARGET_DIR }}/*/*/build
          key: pap-mas-package-${{ runner.os }}-${{ hashFiles('apps/desktop/package-lock.json', 'apps/desktop/Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', 'apps/desktop/cli/Cargo.toml', 'apps/desktop/gateway/Cargo.toml', 'apps/desktop/runtime/Cargo.toml', 'crates/aci-protocol/Cargo.toml') }}
          restore-keys: pap-mas-package-${{ runner.os }}-
      - name: Install build targets and dependencies
        working-directory: apps/desktop
        run: |
          xcodebuild -version
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm ci
      - name: Validate release request
        working-directory: apps/desktop
        run: |
          node --input-type=module -e '
            import semver from "semver";
            import { validateAppStoreBuildNumber } from "./scripts/distribution.mjs";
            const version = process.env.DESKTOP_RELEASE_VERSION;
            if (!semver.valid(version) || semver.prerelease(version) !== null) throw new Error("version must be a stable semantic version");
            validateAppStoreBuildNumber(process.env.APPLE_APP_STORE_BUILD_NUMBER);
            if (process.env.UPLOAD_APP_STORE === "true" && process.env.GITHUB_REF !== "refs/heads/main") throw new Error("App Store uploads must run from main");
          '
      - name: Import App Store signing material
        shell: bash
        env:
          APPLICATION_CERTIFICATE: ${{ secrets.MAC_APP_STORE_APPLICATION_CERTIFICATE }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_STORE_APPLICATION_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE: ${{ secrets.MAC_APP_STORE_INSTALLER_CERTIFICATE }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          for name in APPLICATION_CERTIFICATE APPLICATION_CERTIFICATE_PASSWORD INSTALLER_CERTIFICATE INSTALLER_CERTIFICATE_PASSWORD PROVISIONING_PROFILE APPLE_APPLICATION_IDENTITY APPLE_INSTALLER_IDENTITY; do
            if [[ -z "${!name:-}" ]]; then echo "Missing Mac App Store setting: $name"; exit 1; fi
          done
          keychain="$RUNNER_TEMP/private-ai-proxy-app-store.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          echo "::add-mask::$keychain_password"
          echo "APPLE_APP_STORE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          application_p12="$RUNNER_TEMP/application.p12"
          installer_p12="$RUNNER_TEMP/installer.p12"
          profile="$RUNNER_TEMP/private-ai-proxy.provisionprofile"
          APPLICATION_P12="$application_p12" INSTALLER_P12="$installer_p12" PROFILE_PATH="$profile" node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync(process.env.APPLICATION_P12, Buffer.from(process.env.APPLICATION_CERTIFICATE, "base64"), { mode: 0o600 });
            writeFileSync(process.env.INSTALLER_P12, Buffer.from(process.env.INSTALLER_CERTIFICATE, "base64"), { mode: 0o600 });
            writeFileSync(process.env.PROFILE_PATH, Buffer.from(process.env.PROVISIONING_PROFILE, "base64"), { mode: 0o600 });
          '
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$application_p12" -k "$keychain" -P "$APPLICATION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$installer_p12" -k "$keychain" -P "$INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v "$keychain" | grep -F -- "$APPLE_APPLICATION_IDENTITY"
          security find-certificate -a -c "$APPLE_INSTALLER_IDENTITY" "$keychain" >/dev/null
          {
            echo "APPLE_APP_STORE_KEYCHAIN=$keychain"
            echo "APPLE_APP_STORE_PROFILE=$profile"
          } >> "$GITHUB_ENV"
      - name: Build unsigned Universal app
        working-directory: apps/desktop
        run: npm run dist:app-store -- --bundles app
      - name: Sign and package for App Store Connect
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_bundle"
          package="release/private-ai-proxy-${DESKTOP_RELEASE_VERSION}-mac-app-store.pkg"
          node scripts/package-app-store.mjs \
            --app "$app_bundle" \
            --profile "$APPLE_APP_STORE_PROFILE" \
            --application-identity "$APPLE_APPLICATION_IDENTITY" \
            --installer-identity "$APPLE_INSTALLER_IDENTITY" \
            --output "$package"
          echo "APPLE_APP_STORE_PACKAGE=$PWD/$package" >> "$GITHUB_ENV"
      - name: Upload package artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: private-ai-proxy-${{ inputs.version }}-${{ inputs.build_number }}-mac-app-store
          path: apps/desktop/release/*-mac-app-store.pkg
          if-no-files-found: error
          retention-days: 14
      - name: Prepare App Store Connect key
        if: inputs.upload
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_PRIVATE_KEY"
          key_root="$RUNNER_TEMP/app-store-connect"
          key_directory="$key_root/private_keys"
          key_path="$key_directory/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          mkdir -p "$key_directory"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_ROOT=$key_root" >> "$GITHUB_ENV"
      - name: Upload to App Store Connect
        if: inputs.upload
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_ISSUER"
          cd "$APPLE_API_KEY_ROOT"
          xcrun altool --validate-app --type macos --file "$APPLE_APP_STORE_PACKAGE" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          xcrun altool --upload-app --type macos --file "$APPLE_APP_STORE_PACKAGE" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/private-ai-proxy-app-store.keychain-db"
          cleanup_status=0
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain" || cleanup_status=$?; fi
          rm -f "$RUNNER_TEMP/application.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/private-ai-proxy.provisionprofile"
          rm -rf "$RUNNER_TEMP/app-store-connect"
          exit "$cleanup_status"
