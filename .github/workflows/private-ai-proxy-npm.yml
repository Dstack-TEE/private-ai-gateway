name: Private AI Proxy npm packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published desktop release tag to package (for example desktop-v0.1.3)
        required: true
        type: string
      publish:
        description: Publish the verified tarballs to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: private-ai-proxy-npm-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install packaging dependencies
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
      - id: release
        name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "npm publication must run from main or the matching release tag" >&2
            exit 1
          fi
          metadata="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName)"
          node --input-type=module - "$metadata" "$RELEASE_TAG" "$GITHUB_OUTPUT" <<'NODE'
          import { appendFileSync } from "node:fs";
          import semver from "./apps/desktop/node_modules/semver/index.js";
          import { validateNpmVersion } from "./apps/desktop/scripts/package-npm.mjs";

          const [metadataJson, requestedTag, output] = process.argv.slice(2);
          const metadata = JSON.parse(metadataJson);
          if (metadata.isDraft || metadata.tagName !== requestedTag || !requestedTag.startsWith("desktop-v")) {
            throw new Error("release_tag must name a published desktop-v* GitHub release");
          }
          const version = validateNpmVersion(requestedTag.slice("desktop-v".length));
          const distTag = semver.prerelease(version) ? "beta" : "latest";
          appendFileSync(output, `version=${version}\ndist_tag=${distTag}\n`);
          NODE
          if [[ "$PUBLISH" == true ]]; then
            comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_TAG...main" --jq .status)"
            if [[ "$comparison" != ahead && "$comparison" != identical ]]; then
              echo "$RELEASE_TAG is not contained in main" >&2
              exit 1
            fi
          fi
      - name: Download and verify CLI release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-downloads
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-downloads \
            --pattern SHA256SUMS \
            --pattern "private-ai-proxy-cli-${VERSION}-*.tar.gz" \
            --pattern "private-ai-proxy-cli-${VERSION}-*.zip"

          expected=()
          for target in macos-arm64 macos-x64 linux-arm64 linux-x64; do
            expected+=("private-ai-proxy-cli-${VERSION}-${target}.tar.gz")
          done
          for target in windows-arm64 windows-x64; do
            expected+=("private-ai-proxy-cli-${VERSION}-${target}.zip")
          done
          : > release-downloads/npm-SHA256SUMS
          for filename in "${expected[@]}"; do
            test -f "release-downloads/$filename"
            line="$(awk -v filename="$filename" '$2 == filename { print }' release-downloads/SHA256SUMS)"
            test "$(printf '%s\n' "$line" | grep -c .)" -eq 1
            printf '%s\n' "$line" >> release-downloads/npm-SHA256SUMS
          done
          cd release-downloads
          sha256sum --check npm-SHA256SUMS
      - name: Build npm tarballs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir extracted npm-packages
          while read -r platform arch extension; do
            base="private-ai-proxy-cli-${VERSION}-${platform}-${arch}"
            destination="extracted/${platform}-${arch}"
            mkdir "$destination"
            if [[ "$extension" == zip ]]; then
              unzip -q "release-downloads/${base}.zip" -d "$destination"
            else
              tar -xzf "release-downloads/${base}.tar.gz" -C "$destination"
            fi
            node apps/desktop/scripts/package-npm.mjs platform \
              --platform "$platform" \
              --arch "$arch" \
              --version "$VERSION" \
              --source "$destination/$base" \
              --output npm-packages
          done <<'TARGETS'
          macos arm64 tar.gz
          macos x64 tar.gz
          linux arm64 tar.gz
          linux x64 tar.gz
          windows arm64 zip
          windows x64 zip
          TARGETS
          node apps/desktop/scripts/package-npm.mjs wrapper \
            --version "$VERSION" \
            --output npm-packages
      # package-npm.test.mjs covers the generated manifests; this checks that
      # each tarball holds exactly the expected files and the released binaries.
      - name: Verify npm tarballs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          while read -r platform npm_platform arch binary_extension; do
            if [[ "$binary_extension" == none ]]; then binary_extension=""; fi
            tarball="npm-packages/private-ai-proxy-${VERSION}-${npm_platform}-${arch}.tgz"
            source="extracted/${platform}-${arch}/private-ai-proxy-cli-${VERSION}-${platform}-${arch}"
            destination="verified/${platform}-${arch}"
            mkdir -p "$destination"
            tar -xzf "$tarball" -C "$destination"
            diff -u \
              <(printf '%s\n' package/LICENSE package/README.md package/package.json "package/vendor/private-ai-proxy${binary_extension}" "package/vendor/private-ai-proxy-helper${binary_extension}" "package/vendor/private-ai-proxy-service${binary_extension}" | sort) \
              <(tar -tzf "$tarball" | sort)
            for binary in private-ai-proxy private-ai-proxy-helper private-ai-proxy-service; do
              cmp "$source/${binary}${binary_extension}" "$destination/package/vendor/${binary}${binary_extension}"
            done
          done <<'TARGETS'
          macos darwin arm64 none
          macos darwin x64 none
          linux linux arm64 none
          linux linux x64 none
          windows win32 arm64 .exe
          windows win32 x64 .exe
          TARGETS

          wrapper="npm-packages/private-ai-proxy-${VERSION}.tgz"
          diff -u \
            <(printf '%s\n' package/LICENSE package/README.md package/bin/aci.cjs package/bin/private-ai-proxy.cjs package/package.json | sort) \
            <(tar -tzf "$wrapper" | sort)
      - name: Smoke-test a global npm installation
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/private-ai-proxy-npm"
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund \
            "private-ai-proxy-linux-x64@file:$GITHUB_WORKSPACE/npm-packages/private-ai-proxy-${VERSION}-linux-x64.tgz" \
            "file:$GITHUB_WORKSPACE/npm-packages/private-ai-proxy-${VERSION}.tgz"
          test "$("$prefix/bin/private-ai-proxy" --version)" = "private-ai-proxy $VERSION"
          test "$("$prefix/bin/pap" --version)" = "private-ai-proxy $VERSION"
          test "$("$prefix/bin/aci" --version)" = "private-ai-proxy $VERSION"
          "$prefix/bin/pap" app open --help | grep -F -- '--web'
      - name: Upload npm tarballs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: private-ai-proxy-npm-${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: npm-packages/*.tgz

  # Trusted publishing (OIDC) only authorizes `npm publish`; `npm dist-tag` is
  # not available to this job, so the wrapper moves the channel tag as it
  # publishes. Every version shares one packument, which the registry writes
  # whole, and the platform versions are published first, so any packument
  # that lists the new wrapper also lists its platform versions. Publishing the
  # wrapper last is therefore enough; there is nothing to wait for.
  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY_HELPER: apps/desktop/scripts/npm-registry.mjs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/scripts/npm-registry.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: private-ai-proxy-npm-${{ needs.package.outputs.version }}
          path: npm-packages
      # Like @openai/codex (.github/workflows/rust-release.yml), each platform
      # version of the one package gets its own dist-tag, `<os>-<cpu>` or
      # `beta-<os>-<cpu>`, so `latest` and `beta` only ever name the wrapper.
      # Every tarball updates the same packument, so publish serially. Trusted
      # publishing generates provenance without `--provenance`.
      - name: Publish platform versions
        env:
          DIST_TAG: ${{ needs.package.outputs.dist_tag }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$npm_version"
          for target in \
            darwin-arm64 \
            darwin-x64 \
            linux-arm64 \
            linux-x64 \
            win32-arm64 \
            win32-x64
          do
            platform_tag="$target"
            if [[ "$DIST_TAG" != latest ]]; then
              platform_tag="${DIST_TAG}-${target}"
            fi
            tarball="$(realpath "npm-packages/private-ai-proxy-${VERSION}-${target}.tgz")"
            state="$(node "$REGISTRY_HELPER" state "$tarball")"
            if [[ "$state" == published ]]; then
              echo "private-ai-proxy@${VERSION}-${target} already exists with matching contents; skipping"
            else
              npm publish "$tarball" --access public --tag "$platform_tag"
            fi
          done
      - name: Publish wrapper with the channel dist-tag
        env:
          DIST_TAG: ${{ needs.package.outputs.dist_tag }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          tarball="$(realpath "npm-packages/private-ai-proxy-${VERSION}.tgz")"
          state="$(node "$REGISTRY_HELPER" state "$tarball")"
          if [[ "$state" == published ]]; then
            echo "private-ai-proxy@${VERSION} already exists with matching contents; skipping"
          else
            npm publish "$tarball" --access public --tag "$DIST_TAG"
          fi
