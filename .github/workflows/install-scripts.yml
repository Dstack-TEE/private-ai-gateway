name: Install scripts

on:
  pull_request:
    paths:
      - '.github/workflows/install-scripts.yml'
      - 'scripts/install-private-ai-proxy.sh'
      - 'scripts/install-private-ai-proxy.ps1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/install-scripts.yml'
      - 'scripts/install-private-ai-proxy.sh'
      - 'scripts/install-private-ai-proxy.ps1'

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and upgrade in an isolated user directory
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/private-ai-proxy"
          bin="$RUNNER_TEMP/bin"
          scripts/install-private-ai-proxy.sh --version 0.1.3 --install-dir "$root" --bin-dir "$bin"
          test "$("$bin/pap" --version)" = "private-ai-proxy 0.1.3"
          scripts/install-private-ai-proxy.sh --version 0.1.3 --install-dir "$root" --bin-dir "$bin"
          test "$("$bin/private-ai-proxy" --version)" = "private-ai-proxy 0.1.3"
          test "$("$bin/aci" --version)" = "private-ai-proxy 0.1.3"

  windows:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and upgrade in an isolated user directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = Join-Path $env:RUNNER_TEMP 'Private AI Proxy CLI'
          .\scripts\install-private-ai-proxy.ps1 -Version 0.1.3 -InstallDir $installDir
          if ((& "$installDir\pap.cmd" --version).Trim() -ne 'private-ai-proxy 0.1.3') { throw 'pap version mismatch' }
          .\scripts\install-private-ai-proxy.ps1 -Version 0.1.3 -InstallDir $installDir
          if ((& "$installDir\private-ai-proxy.exe" --version).Trim() -ne 'private-ai-proxy 0.1.3') { throw 'CLI version mismatch' }
          if ((& "$installDir\aci.cmd" --version).Trim() -ne 'private-ai-proxy 0.1.3') { throw 'aci version mismatch' }
          & "$installDir\private-ai-proxy.exe" --yes cli uninstall | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'CLI uninstall failed' }
