name: TypeScript clients

on:
  pull_request:
    paths:
      - 'clients/**'
      - '.github/workflows/pi-provider.yml'
  push:
    branches:
      - main
    paths:
      - 'clients/**'
      - '.github/workflows/pi-provider.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install clients
        working-directory: clients
        run: npm ci

      - name: Verify clients
        working-directory: clients
        run: |
          npm run build
          npm run check
          npm test
          npm run test:bun
          npm run lint
          npm run format:check
          npm run lint:packages

      - name: Package smoke test
        run: bash clients/package-smoke.sh
