name: pi-provider

on:
  pull_request:
    paths:
      - 'clients/pi-provider/**'
      - 'clients/verifier-ts/**'
      - '.github/workflows/pi-provider.yml'
  push:
    branches:
      - main
    paths:
      - 'clients/pi-provider/**'
      - 'clients/verifier-ts/**'
      - '.github/workflows/pi-provider.yml'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            clients/verifier-ts/package-lock.json
            clients/pi-provider/package-lock.json

      # file:../../../verifier-ts runs prepare→tsc; verifier deps must exist first.
      - name: Install verifier
        working-directory: clients/verifier-ts
        run: npm ci

      - name: Install pi-provider
        working-directory: clients/pi-provider
        run: npm ci

      - name: Type-check
        working-directory: clients/pi-provider
        run: npm run check

      - name: Lint
        working-directory: clients/pi-provider
        run: npm run lint

      - name: Test
        working-directory: clients/pi-provider
        run: npm test

  pack-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/verifier-ts/package-lock.json

      - name: Install verifier
        working-directory: clients/verifier-ts
        run: npm ci

      - name: Install pi (for artifact smoke)
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Pack brand artifacts
        working-directory: clients/pi-provider
        run: make pack
        env:
          PI_OFFLINE: "1"
