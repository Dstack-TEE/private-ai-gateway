name: Desktop Tauri

on:
  # Desktop release (desktop-release.yml) calls this workflow for release tags.
  workflow_call:
  workflow_dispatch:
    inputs:
      package_only:
        description: Skip full verification for a non-release package smoke build
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/desktop-native.yml'
      - '.github/workflows/desktop-package.yml'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/desktop-mac-app-store.yml'
      - '.github/workflows/desktop-update-feed.yml'
      - '.github/workflows/private-ai-proxy-npm.yml'
      - '.github/actions/desktop-node/**'
      - 'apps/desktop/**'
      - 'crates/aci-protocol/**'
      - 'crates/aci-verify/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/desktop-native.yml'
      - '.github/workflows/desktop-package.yml'
      - '.github/workflows/desktop-update-feed.yml'
      - '.github/workflows/private-ai-proxy-npm.yml'
      - '.github/actions/desktop-node/**'
      - 'apps/desktop/**'
      - 'crates/aci-protocol/**'
      - 'crates/aci-verify/**'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
  PAP_RUST_CACHE_NAMESPACE: ubuntu-24.04

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    if: ${{ inputs.package_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: rust
        with:
          toolchain: stable
          components: rustfmt, clippy
      - &restore-rust-cache
        name: Restore Rust dependencies
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: &rust-cache-paths |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}/*/.fingerprint
            ${{ env.CARGO_TARGET_DIR }}/*/deps
            ${{ env.CARGO_TARGET_DIR }}/*/build
            ${{ env.CARGO_TARGET_DIR }}/*/*/.fingerprint
            ${{ env.CARGO_TARGET_DIR }}/*/*/deps
            ${{ env.CARGO_TARGET_DIR }}/*/*/build
          key: pap-rust-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.PAP_RUST_CACHE_NAMESPACE }}-${{ env.PAP_BUILD_TARGET || 'host' }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/Cargo.toml', 'apps/desktop/cli/Cargo.toml', 'apps/desktop/core/Cargo.toml', 'apps/desktop/agent-bridge/Cargo.toml', 'apps/desktop/runtime/Cargo.toml', 'apps/desktop/src-tauri/Cargo.toml', 'crates/aci-protocol/Cargo.toml', 'crates/aci-verify/Cargo.toml') }}
          restore-keys: |
            pap-rust-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.PAP_RUST_CACHE_NAMESPACE }}-${{ env.PAP_BUILD_TARGET || 'host' }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/Cargo.toml', 'apps/desktop/cli/Cargo.toml', 'apps/desktop/core/Cargo.toml', 'apps/desktop/agent-bridge/Cargo.toml', 'apps/desktop/runtime/Cargo.toml', 'apps/desktop/src-tauri/Cargo.toml', 'crates/aci-protocol/Cargo.toml', 'crates/aci-verify/Cargo.toml') }}-partial-
            pap-rust-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.PAP_RUST_CACHE_NAMESPACE }}-${{ env.PAP_BUILD_TARGET || 'host' }}-${{ steps.rust.outputs.cachekey }}-
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring dbus-x11 libsecret-tools rpm libarchive-tools
      # nfpm (GoReleaser's packager) builds every Linux package.
      - name: Install nfpm
        if: runner.os == 'Linux'
        run: bash apps/desktop/scripts/install-nfpm.sh
      - uses: ./.github/actions/desktop-node
      - name: Verify renderer
        working-directory: apps/desktop
        run: |
          npm run check
          npm run build:web
          npm run test:release
      - name: Stage Tauri sidecars
        working-directory: apps/desktop
        run: npm run build:sidecars:debug
      # Desktop Mac App Store (desktop-mac-app-store.yml) checks the
      # mac-app-store feature on macOS, and CI (ci.yml) tests aci-protocol and aci-verify.
      - name: Verify Rust sources
        working-directory: apps/desktop
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      # CycloneDX SBOMs that the release job attests. They are generated on
      # every run so that a tool change fails here rather than on a release
      # tag. `--target all` covers every platform's dependencies.
      - name: Generate SBOMs
        working-directory: apps/desktop
        env:
          CARGO_CYCLONEDX_VERSION: 0.5.9
        run: |
          set -euo pipefail
          asset=cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz
          directory="$RUNNER_TEMP/cargo-cyclonedx"
          mkdir -p "$directory" "$RUNNER_TEMP/sbom"
          curl -fsSL -o "$directory/$asset" "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-${CARGO_CYCLONEDX_VERSION}/$asset"
          printf '%s  %s\n' fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8 "$directory/$asset" | sha256sum -c -
          tar -xJf "$directory/$asset" -C "$directory" --strip-components=1 cargo-cyclonedx-x86_64-unknown-linux-gnu/cargo-cyclonedx
          PATH="$directory:$PATH" cargo cyclonedx --format json --spec-version 1.5 --target all
          mv cli/private-ai-proxy.cdx.json src-tauri/private-ai-proxy-desktop.cdx.json "$RUNNER_TEMP/sbom/"
          npm sbom --omit dev --sbom-format cyclonedx --sbom-type application > "$RUNNER_TEMP/sbom/private-ai-proxy-renderer.cdx.json"
      - name: Upload SBOMs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-sbom
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/sbom/
      - &save-rust-cache
        name: Save Rust dependencies
        if: always() && !cancelled() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: *rust-cache-paths
          key: ${{ job.status == 'success' && steps.rust-cache.outputs.cache-primary-key || format('{0}-partial-{1}-{2}', steps.rust-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

  # Native Linux arm64 library tests: libc constants and syscall behaviour
  # differ from x86_64, and nothing else runs these crates' tests on arm64.
  verify-linux-arm64:
    name: Verify libraries (linux-arm64)
    if: ${{ inputs.package_only != true }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: rust
        with:
          toolchain: stable
      - *restore-rust-cache
      - name: Test desktop libraries
        working-directory: apps/desktop
        run: cargo test --locked --package private-ai-proxy-core --package private-ai-proxy-runtime --package private-ai-proxy-agent-bridge --lib
      - *save-rust-cache

  # Native Windows library tests on every change: the ACL, named-pipe and
  # file-replacement code only compiles and runs there. Packages build after
  # it; the windows-arm64 package job runs the same tests on arm64.
  verify-windows-x64:
    name: Verify libraries (windows-x64)
    if: ${{ inputs.package_only != true }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: rust
        with:
          toolchain: stable
          components: clippy
      - *restore-rust-cache
      - name: Test desktop libraries
        working-directory: apps/desktop
        run: cargo test --locked --package private-ai-proxy-core --package private-ai-proxy-runtime --package private-ai-proxy-agent-bridge --lib
      # The CLI and the desktop shell have Windows-only code too. Checking the
      # shell needs no staged sidecars: TAURI_CONFIG merges an empty
      # externalBin, which only bundling uses.
      - name: Lint the CLI and the desktop shell
        working-directory: apps/desktop
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo clippy --locked --all-targets --package private-ai-proxy --package private-ai-proxy-desktop -- -D warnings
      - *save-rust-cache

  version:
    name: Resolve version
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')) }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      app_store_build_number: ${{ steps.version.outputs.app_store_build_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/desktop-node
        with:
          ignore-scripts: true
      - id: version
        name: Resolve the committed version and release channel
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ONLY: ${{ inputs.package_only }}
        run: node scripts/release-request.mjs desktop

  # Stable releases also upload the App Store build, in parallel with the
  # Direct packages; the release job publishes only after both succeed. The
  # upload cannot be undone and uses up its build number, so it waits for
  # every verification job the packages wait for.
  mac-app-store:
    needs: [version, verify, verify-linux-arm64, verify-windows-x64]
    if: needs.version.outputs.channel == 'stable'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-mac-app-store.yml
    with:
      build_number: ${{ needs.version.outputs.app_store_build_number }}
    secrets: inherit

  package:
    name: Build desktop packages
    needs: [verify, verify-linux-arm64, verify-windows-x64, version]
    if: ${{ !cancelled() && needs.version.result == 'success' && ((needs.verify.result == 'success' && needs.verify-linux-arm64.result == 'success' && needs.verify-windows-x64.result == 'success') || inputs.package_only == true) }}
    uses: ./.github/workflows/desktop-package.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: ${{ needs.version.outputs.channel }}
      package_only: ${{ inputs.package_only == true }}
    secrets: inherit

  release:
    needs: [version, verify, package, mac-app-store]
    if: ${{ !cancelled() && needs.version.outputs.channel != '' && needs.package.result == 'success' && (needs.mac-app-store.result == 'success' || needs.mac-app-store.result == 'skipped') }}
    environment: desktop-release
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    env:
      CHANNEL: ${{ needs.version.outputs.channel }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          # Only the Direct package jobs' artifacts; the App Store pkg stays private.
          pattern: desktop-package-*
          path: release
          merge-multiple: true
      - name: Install release tooling
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
      - name: Stage the CLI install scripts
        shell: bash
        run: |
          cp scripts/install-private-ai-proxy.sh scripts/install-private-ai-proxy.ps1 release/
      - name: Prepare Linux signing
        shell: bash
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: bash apps/desktop/scripts/prepare-linux-signing.sh apps/desktop/packaging/linux-signing-key.asc >> "$GITHUB_ENV"
      - name: Sign Arch packages and release checksums
        shell: bash
        run: |
          set -euo pipefail
          gnupg="$RUNNER_TEMP/pap-linux-signing/gnupg"
          signer=(gpg --batch --no-tty --homedir "$gnupg" --pinentry-mode loopback --passphrase '' --local-user "$PAP_LINUX_SIGNING_FINGERPRINT!")
          for package in release/*.pkg.tar.zst; do
            "${signer[@]}" --detach-sign "$package"
          done
          # The manifest consumes only Tauri signatures. SHA256SUMS also covers
          # the detached Arch signatures and the CLI install scripts.
          node apps/desktop/scripts/create-update-manifest.mjs release "$VERSION" "$GITHUB_REPOSITORY" "$CHANNEL"
          (cd release && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" release/SHA256SUMS
          "${signer[@]}" --armor --detach-sign release/SHA256SUMS
      - name: Remove Linux signing material
        if: always()
        shell: bash
        run: bash apps/desktop/scripts/remove-linux-signing.sh
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      # The verify job's SBOMs, attested to the packages they describe rather
      # than published as assets. Every package ships the CLI binaries (the
      # desktop packages as sidecars) and its service embeds the web UI
      # renderer; the desktop packages also ship the desktop shell crate.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: desktop-sbom
          path: sbom
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/private-ai-proxy-*
            !release/*.pkg.tar.zst.sig
          sbom-path: sbom/private-ai-proxy.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/private-ai-proxy-*
            !release/*.pkg.tar.zst.sig
          sbom-path: sbom/private-ai-proxy-renderer.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/private-ai-proxy-[0-9]*
            !release/*.pkg.tar.zst.sig
          sbom-path: sbom/private-ai-proxy-desktop.cdx.json
      # release-please created the draft with the changelog as its notes.
      - name: Attach the assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" release/* --clobber
      - name: Verify the attached CLI install scripts against the tagged source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/attached-installers.XXXXXX")
          gh release download "$TAG" --dir "$directory" \
            --pattern install-private-ai-proxy.sh --pattern install-private-ai-proxy.ps1
          for installer in install-private-ai-proxy.sh install-private-ai-proxy.ps1; do
            git show "$GITHUB_SHA:scripts/$installer" | cmp - "$directory/$installer"
          done
      # Download links (and the App Store for stable versions) go above the
      # changelog and integrity details below it; a rerun replaces both.
      - name: Add download links to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body \
            | node apps/desktop/scripts/release-notes.mjs release "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Publish desktop version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=true latest=false
          if [[ "$CHANNEL" == stable ]]; then prerelease=false latest=true; fi
          gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$latest" --title "Private AI Proxy v$VERSION"

  publish-linux-repos:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/linux-repos.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
      PKG_REPO_R2_ACCESS_KEY_ID: ${{ secrets.PKG_REPO_R2_ACCESS_KEY_ID }}
      PKG_REPO_R2_SECRET_ACCESS_KEY: ${{ secrets.PKG_REPO_R2_SECRET_ACCESS_KEY }}

  # Beta releases skip the App Store job, and a job whose `if` has no status
  # check function inherits success(), which is false after any skipped
  # dependency, direct or not; so each job after it checks its own result.
  update-feed:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-update-feed.yml
    with:
      tag: ${{ github.ref_name }}

  publish-aur:
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.version.outputs.channel == 'stable' }}
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  submit-winget:
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.version.outputs.channel == 'stable' }}
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  publish-npm:
    needs: update-feed
    if: ${{ !cancelled() && needs.update-feed.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    steps:
      # The workflow dispatch API returns the run it created
      # (return_run_details), so the job watches exactly that run.
      - name: Dispatch trusted npm publisher
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          run_id="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/private-ai-proxy-npm.yml/dispatches" \
            -f ref="$RELEASE_TAG" \
            -f 'inputs[release_tag]'="$RELEASE_TAG" \
            -f 'inputs[publish]'=true \
            -F return_run_details=true \
            --jq .workflow_run_id)"
          if [[ -z "$run_id" ]]; then
            echo "The dispatch API returned no workflow_run_id for private-ai-proxy-npm.yml" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
