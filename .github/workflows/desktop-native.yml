name: Desktop native clients

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-native.yml'
      - 'apps/desktop/**'
      - 'src/aci/**'
      - 'src/bin/aci/**'
      - 'src/http/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  push:
    branches:
      - main
      - feat/private-ai-gateway-native-clients
    paths:
      - '.github/workflows/desktop-native.yml'
      - 'apps/desktop/**'
      - 'src/aci/**'
      - 'src/bin/aci/**'
      - 'src/http/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.89'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/gateway -> target
            apps/desktop/runtime -> target
      - name: Verify shared desktop runtime
        run: |
          cargo +1.89 fmt --manifest-path apps/desktop/gateway/Cargo.toml -- --check
          cargo +1.89 fmt --manifest-path apps/desktop/runtime/Cargo.toml -- --check
          cargo +1.89 clippy --locked --all-targets --manifest-path apps/desktop/gateway/Cargo.toml -- -D warnings
          cargo +1.89 clippy --locked --all-targets --manifest-path apps/desktop/runtime/Cargo.toml -- -D warnings
          cargo +1.89 test --locked --manifest-path apps/desktop/gateway/Cargo.toml
          cargo +1.89 test --locked --manifest-path apps/desktop/runtime/Cargo.toml

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/gateway -> target
            apps/desktop/runtime -> target
            apps/desktop/native/linux -> target
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libdbus-1-dev libsecret-1-dev dbus-x11 xauth xvfb
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Package native Linux client
        working-directory: apps/desktop
        run: npm run dist:native:linux
      - name: Smoke runtime protocol
        working-directory: apps/desktop
        run: dbus-run-session -- node scripts/native-runtime-smoke.mjs release/native-linux/Private-AI-Gateway/private-ai-gateway-desktop-service
      - name: Launch native Linux client
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- bash -c '
            export GTK_A11Y=none
            log="$RUNNER_TEMP/private-ai-gateway-linux.log"
            xvfb-run -a release/native-linux/Private-AI-Gateway/private-ai-gateway --autostart >"$log" 2>&1 &
            pid=$!
            sleep 5
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              wait "$pid"
            fi
            kill "$pid"
            wait "$pid" || true
          '
      - uses: actions/upload-artifact@v6
        with:
          name: private-ai-gateway-native-linux-${{ github.sha }}
          retention-days: 14
          path: |
            apps/desktop/release/*.deb
            apps/desktop/release/*native-linux*.tar.gz

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/gateway -> target
            apps/desktop/runtime -> target
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Package native Windows client
        working-directory: apps/desktop
        run: npm run dist:native:windows
      - name: Smoke runtime protocol
        working-directory: apps/desktop
        run: node scripts/native-runtime-smoke.mjs release/native-windows/Private-AI-Gateway/private-ai-gateway-desktop-service.exe
      - name: Launch native Windows client
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'release/native-windows/Private-AI-Gateway/PrivateAIGateway.Windows.exe' -ArgumentList '--autostart' -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Native Windows client exited during launch smoke" }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v6
        with:
          name: private-ai-gateway-native-windows-${{ github.sha }}
          retention-days: 14
          path: apps/desktop/release/*native-windows*.zip

  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/gateway -> target
            apps/desktop/runtime -> target
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Package native macOS client
        working-directory: apps/desktop
        run: npm run dist:native:macos
      - name: Smoke runtime protocol
        working-directory: apps/desktop
        run: node scripts/native-runtime-smoke.mjs 'release/native-macos/Private AI Gateway.app/Contents/MacOS/private-ai-gateway-desktop-service'
      - name: Launch native macOS client
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          app='release/native-macos/Private AI Gateway.app'
          open "$app"
          sleep 5
          pid="$(pgrep -x 'Private AI Gateway' | head -1)"
          test -n "$pid"
          kill "$pid"
      - name: Inspect native macOS package
        working-directory: apps/desktop
        run: |
          test -x 'release/native-macos/Private AI Gateway.app/Contents/MacOS/Private AI Gateway'
          test -x 'release/native-macos/Private AI Gateway.app/Contents/MacOS/private-ai-gateway-desktop-service'
          codesign --verify --deep --strict 'release/native-macos/Private AI Gateway.app'
          hdiutil verify release/Private-AI-Gateway-native-macos.dmg
          unzip -tq release/Private-AI-Gateway-native-macos.zip
      - uses: actions/upload-artifact@v6
        with:
          name: private-ai-gateway-native-macos-${{ github.sha }}
          retention-days: 14
          path: |
            apps/desktop/release/Private-AI-Gateway-native-macos.dmg
            apps/desktop/release/Private-AI-Gateway-native-macos.zip
