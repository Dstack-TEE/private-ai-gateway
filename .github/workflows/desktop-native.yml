name: Desktop Tauri

on:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Run optional renderer and installed app UI checks
        default: false
        type: boolean
      production_macos:
        description: Sign and notarize the macOS package for distribution
        required: true
        default: false
        type: boolean
      release_version:
        description: 'Optional update version matching the channel (for example 0.1.2-beta.1)'
        required: false
        type: string
      release_channel:
        description: Update channel (stable must be explicitly selected)
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      publish_release:
        description: Publish the signed version and advance the desktop update channel
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/desktop-native.yml'
      - 'apps/desktop/**'
      - 'src/aci/**'
      - 'src/bin/aci/**'
      - 'src/http/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/desktop-native.yml'
      - 'apps/desktop/**'
      - 'src/aci/**'
      - 'src/bin/aci/**'
      - 'src/http/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release_version || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: '1.89'
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/gateway -> target
            apps/desktop/runtime -> target
            apps/desktop/src-tauri -> target
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring dbus-x11 libsecret-tools
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Verify generated brand assets
        working-directory: apps/desktop
        run: |
          npm run prepare:brand
          status="$(git status --porcelain=v1 --untracked-files=all -- src/renderer/generated gateway/src/brand.rs src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/icon.ico src-tauri/icons/AppIcon.icon assets/tray)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            git diff -- src/renderer/generated gateway/src/brand.rs src-tauri/icons assets/tray
            exit 1
          fi
      - name: Verify renderer
        working-directory: apps/desktop
        run: |
          npm run check
          npm run test:release
      - name: Optional renderer UI checks
        if: github.event_name == 'workflow_dispatch' && inputs.run_ui_tests
        working-directory: apps/desktop
        run: |
          npx playwright install chromium
          npm run test:renderer
      - name: Stage Tauri sidecars
        working-directory: apps/desktop
        run: npm run build:sidecars:debug
      - name: Verify Rust sources
        run: |
          cargo +1.89 fmt --manifest-path apps/desktop/gateway/Cargo.toml -- --check
          cargo +1.89 fmt --manifest-path apps/desktop/runtime/Cargo.toml -- --check
          cargo +1.89 fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo +1.89 clippy --locked --all-targets --manifest-path apps/desktop/gateway/Cargo.toml -- -D warnings
          cargo +1.89 clippy --locked --all-targets --manifest-path apps/desktop/runtime/Cargo.toml -- -D warnings
          cargo +1.89 clippy --locked --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
          cargo +1.89 test --locked --manifest-path apps/desktop/gateway/Cargo.toml
          cargo +1.89 test --locked --manifest-path apps/desktop/runtime/Cargo.toml
          cargo +1.89 test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test --locked --bin aci
          cargo test --locked --test aci_cli

  package:
    needs: verify
    env:
      DESKTOP_RELEASE_VERSION: ${{ inputs.release_version }}
      DESKTOP_RELEASE_CHANNEL: ${{ inputs.release_channel || 'beta' }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ inputs.release_version && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
      TAURI_UPDATER_ENDPOINT: ${{ inputs.release_version && format('https://github.com/Dstack-TEE/private-ai-gateway/releases/download/desktop-updates-{0}/latest.json', inputs.release_channel || 'beta') || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
            bundles: app,dmg
          - os: windows-2025
            platform: windows-x64
            bundles: nsis
          - os: ubuntu-24.04
            platform: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate updater release configuration
        if: inputs.release_version != ''
        shell: bash
        env:
          PRODUCTION_MACOS: ${{ inputs.production_macos }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          case "$DESKTOP_RELEASE_CHANNEL" in
            beta) [[ "$DESKTOP_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]] ;;
            stable) [[ "$DESKTOP_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ;;
            *) exit 1 ;;
          esac
          test "$PRODUCTION_MACOS" = true
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/gateway -> target
            apps/desktop/runtime -> target
            apps/desktop/src-tauri -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring dbus-x11
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Prepare Apple notarization key
        if: runner.os == 'macOS' && inputs.production_macos
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required macOS release secret: %s\n' "${missing[@]}"
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build production macOS package
        if: runner.os == 'macOS' && inputs.production_macos
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release_version && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release_version && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run dist -- --bundles ${{ matrix.bundles }}

      - name: Build ad-hoc macOS package
        if: runner.os == 'macOS' && inputs.production_macos != true
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run dist -- --bundles ${{ matrix.bundles }}

      - name: Build non-macOS package
        if: runner.os != 'macOS'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release_version && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release_version && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npm run dist -- --bundles ${{ matrix.bundles }}

      - name: Notarize production macOS disk image
        if: runner.os == 'macOS' && inputs.production_macos
        working-directory: apps/desktop
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -f "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Test Windows desktop libraries
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked --manifest-path gateway/Cargo.toml --lib
          cargo test --release --locked --manifest-path runtime/Cargo.toml --lib
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Check installed Windows sidecars without UI
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Tauri Installed Check'
          if (Test-Path $installDir) { throw 'Install check directory already exists' }
          function Run-Installer($executable, $arguments) {
            $process = Start-Process -FilePath $executable -ArgumentList $arguments -PassThru
            if (!$process.WaitForExit(60000)) {
              & taskkill.exe /PID $process.Id /T /F
              throw 'Installer timed out'
            }
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          }
          try {
            Run-Installer $installers[0].FullName "/S /D=$installDir"
            node scripts/packaged-sidecars-smoke.mjs $installDir
            if ($LASTEXITCODE -ne 0) { throw 'Installed sidecar checks failed' }
            $env:PAG_TEST_HELPER_PATH = "$installDir/private-ai-gateway-helper.exe"
            cargo test --release --locked --manifest-path gateway/Cargo.toml --lib -- --ignored hermes_windows_installed_command_round_trip
            if ($LASTEXITCODE -ne 0) { throw 'Hermes credential command failed' }
            cargo test --release --locked --manifest-path gateway/Cargo.toml --lib -- --ignored keyring_round_trip
            if ($LASTEXITCODE -ne 0) { throw 'Credential Manager check failed' }
          } finally {
            if (Test-Path "$installDir/uninstall.exe") {
              Run-Installer "$installDir/uninstall.exe" "/S _?=$installDir"
            }
            foreach ($binary in @('private-ai-gateway-desktop.exe', 'aci.exe', 'private-ai-gateway-helper.exe')) {
              if (Test-Path "$installDir/$binary") { throw "Uninstall left $binary" }
            }
          }

      - name: Check installed Linux sidecars without UI
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          package=$(dpkg-deb -f "${packages[0]}" Package)
          if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then
            echo 'Refusing to replace an existing installation'
            exit 1
          fi
          scratch=$(mktemp -d "$RUNNER_TEMP/tauri-installed.XXXXXX")
          cleanup() {
            local status=$?
            sudo apt-get remove -y "$package" || status=1
            for binary in private-ai-gateway-desktop aci private-ai-gateway-helper; do
              if [[ -e "/usr/bin/$binary" ]]; then status=1; fi
            done
            rm -rf "$scratch"
            return "$status"
          }
          trap cleanup EXIT
          sudo apt-get install -y "${packages[0]}"
          node scripts/packaged-sidecars-smoke.mjs /usr/bin
          export TAURI_CHECK_KEYRING_HOME="$scratch"
          export XDG_RUNTIME_DIR="$scratch/runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euc '
            HOME="$TAURI_CHECK_KEYRING_HOME" gnome-keyring-daemon --foreground --unlock --components=secrets <<< ci-check-only &
            keyring_pid=$!
            trap "kill $keyring_pid 2>/dev/null || true; wait $keyring_pid || true" EXIT
            gdbus wait --session --timeout 10 org.freedesktop.secrets
            cargo test --release --locked --manifest-path gateway/Cargo.toml --lib -- --ignored keyring_round_trip
          '
      - name: Stage and inspect macOS package
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        env:
          PRODUCTION_MACOS: ${{ inputs.production_macos }}
          RUN_UI_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests }}
        run: |
          set -euo pipefail
          mkdir -p release
          app_bundle="$(find src-tauri/target/release/bundle/macos -type d -name '*.app' -print -quit)"
          dmg="$(find src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -d "$app_bundle"
          test -f "$dmg"
          test -x "$app_bundle/Contents/MacOS/private-ai-gateway-helper"
          test -f "$app_bundle/Contents/Resources/Assets.car"
          test -f "$app_bundle/Contents/Resources/icon.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app_bundle/Contents/Info.plist")" = Icon
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          codesign_details="$(codesign --display --verbose=4 "$app_bundle" 2>&1)"
          if [[ "$PRODUCTION_MACOS" == "true" ]]; then
            grep -q '^Authority=Developer ID Application:' <<<"$codesign_details"
            if grep -q '^Signature=adhoc$' <<<"$codesign_details"; then
              echo 'Production package was signed ad-hoc instead of with Developer ID'
              exit 1
            fi
            xcrun stapler validate "$app_bundle"
            xcrun stapler validate "$dmg"
            spctl --assess --type execute --verbose=4 "$app_bundle"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          else
            grep -q '^Signature=adhoc$' <<<"$codesign_details"
          fi
          if [[ "$RUN_UI_TESTS" == true ]]; then
            launch_log="$RUNNER_TEMP/private-ai-gateway-launch.log"
            "$app_bundle/Contents/MacOS/private-ai-gateway-desktop" >"$launch_log" 2>&1 &
            app_pid=$!
            cleanup() {
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            sleep 5
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$launch_log"
              exit 1
            fi
            cleanup
            trap - EXIT
          else
            echo 'Installed UI checks: not run (manual opt-in required).'
          fi
          hdiutil verify "$dmg"
          cp "$dmg" release/
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "release/Private-AI-Gateway-macos-arm64.zip"
          unzip -tq release/Private-AI-Gateway-macos-arm64.zip
      - name: Upload desktop package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: private-ai-gateway-${{ inputs.release_version && (inputs.release_channel || 'beta') || 'test' }}-${{ inputs.release_version || '0.1.0' }}-${{ github.sha }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/macos/*.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/*.sig

      - name: Remove Apple notarization key
        if: always() && runner.os == 'macOS' && inputs.production_macos
        shell: bash
        run: rm -f "${APPLE_API_KEY_PATH:-}"

  draft-release:
    if: inputs.release_version != '' && inputs.production_macos
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.release_version }}
      CHANNEL: ${{ inputs.release_channel || 'beta' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: private-ai-gateway-*
          path: release-artifacts
          merge-multiple: true
      - name: Install release tooling
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
      - name: Create signed update manifest and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/create-update-manifest.mjs release-artifacts "$VERSION" "$GITHUB_REPOSITORY" "$CHANNEL"
          mapfile -d '' assets < <(find release-artifacts -type f \( -name '*.tar.gz' -o -name '*.sig' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name 'latest.json' \) -print0)
          release_args=()
          if [[ "$CHANNEL" == beta ]]; then release_args+=(--prerelease); fi
          gh release create "desktop-v$VERSION" "${assets[@]}" "${release_args[@]}" --draft --latest=false --target "$GITHUB_SHA" --title "Private AI Gateway $VERSION" --generate-notes
      - name: Publish desktop version
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "desktop-v$VERSION" --draft=false --latest=false

  update-feed:
    if: inputs.publish_release && inputs.release_version != '' && inputs.production_macos
    needs: draft-release
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-update-feed.yml
    with:
      tag: desktop-v${{ inputs.release_version }}
