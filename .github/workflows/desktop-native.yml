name: Desktop Tauri

on:
  workflow_dispatch:
    inputs:
      release_platforms:
        description: Comma-separated package targets, or all (macos-arm64, macos-x64, windows-arm64, windows-x64, linux-arm64, linux-x64)
        required: true
        default: all
        type: string
      package_only:
        description: Skip full verification for a non-release package smoke build
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/desktop-native.yml'
      - '.github/workflows/desktop-mac-app-store.yml'
      - '.github/workflows/desktop-update-feed.yml'
      - '.github/workflows/private-ai-proxy-npm.yml'
      - 'apps/desktop/**'
      - 'crates/aci-protocol/**'
  push:
    branches:
      - main
    # release-please tags the merged release PR commit.
    tags:
      - 'desktop-v*'
    paths:
      - '.github/workflows/desktop-native.yml'
      - '.github/workflows/desktop-update-feed.yml'
      - '.github/workflows/private-ai-proxy-npm.yml'
      - 'apps/desktop/**'
      - 'crates/aci-protocol/**'

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/target
  PAP_RUST_CACHE_NAMESPACE: ubuntu-24.04

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    if: ${{ inputs.package_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: rust
        with:
          toolchain: stable
          components: rustfmt, clippy
      - &restore-rust-cache
        name: Restore Rust dependencies
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: &rust-cache-paths |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}/*/.fingerprint
            ${{ env.CARGO_TARGET_DIR }}/*/deps
            ${{ env.CARGO_TARGET_DIR }}/*/build
            ${{ env.CARGO_TARGET_DIR }}/*/*/.fingerprint
            ${{ env.CARGO_TARGET_DIR }}/*/*/deps
            ${{ env.CARGO_TARGET_DIR }}/*/*/build
          key: pap-rust-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.PAP_RUST_CACHE_NAMESPACE }}-${{ env.PAP_BUILD_TARGET || 'host' }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/Cargo.toml', 'apps/desktop/cli/Cargo.toml', 'apps/desktop/core/Cargo.toml', 'apps/desktop/agent-bridge/Cargo.toml', 'apps/desktop/runtime/Cargo.toml', 'apps/desktop/src-tauri/Cargo.toml', 'crates/aci-protocol/Cargo.toml') }}
          restore-keys: |
            pap-rust-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.PAP_RUST_CACHE_NAMESPACE }}-${{ env.PAP_BUILD_TARGET || 'host' }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/Cargo.toml', 'apps/desktop/cli/Cargo.toml', 'apps/desktop/core/Cargo.toml', 'apps/desktop/agent-bridge/Cargo.toml', 'apps/desktop/runtime/Cargo.toml', 'apps/desktop/src-tauri/Cargo.toml', 'crates/aci-protocol/Cargo.toml') }}-partial-
            pap-rust-v2-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.PAP_RUST_CACHE_NAMESPACE }}-${{ env.PAP_BUILD_TARGET || 'host' }}-${{ steps.rust.outputs.cachekey }}-
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring dbus-x11 libsecret-tools rpm libarchive-tools
      # nfpm (GoReleaser's packager) builds every Linux package.
      - &install-nfpm
        name: Install nfpm
        if: runner.os == 'Linux'
        shell: bash
        env:
          NFPM_VERSION: 2.47.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" digest=0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 ;;
            aarch64) asset="nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz" digest=1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c ;;
            *) echo "Unsupported nfpm runner architecture $(uname -m)" >&2; exit 1 ;;
          esac
          directory="$RUNNER_TEMP/nfpm"
          mkdir -p "$directory"
          curl -fsSL -o "$directory/$asset" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$asset"
          printf '%s  %s\n' "$digest" "$directory/$asset" | sha256sum -c -
          tar -xzf "$directory/$asset" -C "$directory" nfpm
          rm "$directory/$asset"
          echo "$directory" >> "$GITHUB_PATH"
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Verify generated brand assets
        working-directory: apps/desktop
        run: |
          npm run prepare:brand
          status="$(git status --porcelain=v1 --untracked-files=all -- src/renderer/generated core/src/brand.rs src-tauri/icons/32x32.png src-tauri/icons/128x128.png src-tauri/icons/128x128@2x.png src-tauri/icons/icon.png src-tauri/icons/icon.icns src-tauri/icons/icon.ico src-tauri/icons/AppIcon.icon src-tauri/installer/brand-*.bmp src-tauri/installer/brand-dmg-background.png assets/tray)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            git diff -- src/renderer/generated core/src/brand.rs src-tauri/icons src-tauri/installer assets/tray
            exit 1
          fi
      - name: Verify renderer
        working-directory: apps/desktop
        run: |
          npm run check
          npm run build:web
          npm run test:release
          npm run test:probe
      - name: Stage Tauri sidecars
        working-directory: apps/desktop
        run: npm run build:sidecars:debug
      - name: Verify Rust sources
        working-directory: apps/desktop
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          app_store_config="$(cat src-tauri/tauri.appstore.conf.json)"
          cargo clippy --locked --all-targets --package private-ai-proxy-core --features mac-app-store -- -D warnings
          cargo clippy --locked --all-targets --package private-ai-proxy-runtime --features mac-app-store -- -D warnings
          cargo test --locked --package private-ai-proxy-core --features mac-app-store
          cargo test --locked --package private-ai-proxy-runtime --features mac-app-store
          TAURI_CONFIG="$app_store_config" cargo clippy --locked --all-targets --package private-ai-proxy-desktop --features mac-app-store -- -D warnings
          TAURI_CONFIG="$app_store_config" cargo test --locked --package private-ai-proxy-desktop --features mac-app-store
          cargo test --locked --manifest-path ../../crates/aci-protocol/Cargo.toml
      - &save-rust-cache
        name: Save Rust dependencies
        if: always() && !cancelled() && steps.rust-cache.outputs.cache-primary-key != '' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: *rust-cache-paths
          key: ${{ job.status == 'success' && steps.rust-cache.outputs.cache-primary-key || format('{0}-partial-{1}-{2}', steps.rust-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

  # Native Linux arm64 library tests: libc constants and syscall behaviour
  # differ from x86_64, and nothing else runs these crates' tests on arm64.
  verify-linux-arm64:
    name: Verify libraries (linux-arm64)
    if: ${{ inputs.package_only != true }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: rust
        with:
          toolchain: stable
      - *restore-rust-cache
      - name: Test desktop libraries
        working-directory: apps/desktop
        run: cargo test --locked --package private-ai-proxy-core --package private-ai-proxy-runtime --package private-ai-proxy-agent-bridge --lib
      - *save-rust-cache

  # Native Windows library tests on every change: the ACL, named-pipe and
  # file-replacement code only compiles and runs there, and otherwise runs
  # only in package builds.
  verify-windows-x64:
    name: Verify libraries (windows-x64)
    if: ${{ inputs.package_only != true }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: rust
        with:
          toolchain: stable
      - *restore-rust-cache
      - name: Test desktop libraries
        working-directory: apps/desktop
        run: cargo test --locked --package private-ai-proxy-core --package private-ai-proxy-runtime --package private-ai-proxy-agent-bridge --lib
      - *save-rust-cache

  select-platforms:
    name: Select release platforms
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
      version: ${{ steps.platforms.outputs.version }}
      channel: ${{ steps.platforms.outputs.channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install release tooling
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
      - id: platforms
        name: Build package matrix
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ONLY: ${{ inputs.package_only }}
          RELEASE_PLATFORMS: ${{ inputs.release_platforms || 'all' }}
        run: |
          set -euo pipefail
          version="$(node --input-type=module -e 'import { appVersion } from "./scripts/release-channel.mjs"; process.stdout.write(appVersion())')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          # Tags are releases: release-please creates them on main at the
          # commit that sets their version.
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            if [[ "$GITHUB_REF_NAME" != "desktop-v$version" || "$PACKAGE_ONLY" == true || "$RELEASE_PLATFORMS" != all ]]; then
              echo "$GITHUB_REF_NAME must build every platform of the committed version $version" >&2
              exit 1
            fi
            comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...main" --jq .status)"
            if [[ "$comparison" != ahead && "$comparison" != identical ]]; then
              echo "$GITHUB_REF_NAME is not contained in main" >&2
              exit 1
            fi
            channel="$(node --input-type=module -e 'import { versionRelease } from "./scripts/release-channel.mjs"; process.stdout.write(versionRelease(process.argv[1]).channel)' "$version")"
            printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"
          fi
          matrix="$(node scripts/select-release-platforms.mjs "$RELEASE_PLATFORMS")"
          node --input-type=module -e 'const value = JSON.parse(process.argv[1]); if (!Array.isArray(value.include) || value.include.length === 0) process.exit(1)' "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  # Stable releases upload the App Store build first. This workflow's run
  # number increases with every run, as CFBundleVersion must.
  mac-app-store:
    needs: select-platforms
    if: needs.select-platforms.outputs.channel == 'stable'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-mac-app-store.yml
    with:
      build_number: '${{ github.run_number }}'
      upload: true
    secrets: inherit

  package:
    name: Package (${{ matrix.platform }})
    needs: [verify, verify-linux-arm64, select-platforms]
    if: ${{ always() && needs.select-platforms.result == 'success' && ((needs.verify.result == 'success' && needs.verify-linux-arm64.result == 'success') || inputs.package_only == true) }}
    environment:
      name: ${{ needs.select-platforms.outputs.channel != '' && 'desktop-release' || 'desktop-build' }}
    env:
      # Empty for test packages.
      RELEASE_CHANNEL: ${{ needs.select-platforms.outputs.channel }}
      VERSION: ${{ needs.select-platforms.outputs.version }}
      PAP_BUILD_TARGET: ${{ matrix.target }}
      PAP_BUNDLE_DIR: ${{ github.workspace }}/apps/desktop/target/${{ matrix.bundle_dir }}
      PAP_RUST_CACHE_NAMESPACE: ${{ matrix.os }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ needs.select-platforms.outputs.channel && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
      TAURI_UPDATER_ENDPOINT: ${{ needs.select-platforms.outputs.channel && format('https://github.com/Dstack-TEE/private-ai-gateway/releases/download/desktop-updates-{0}/latest.json', needs.select-platforms.outputs.channel) || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.cli_platform == 'macos' && 90 || 60 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        id: rust
        with:
          toolchain: stable
      - *restore-rust-cache
      - name: Install macOS target
        if: runner.os == 'macOS'
        run: rustup target add "$PAP_BUILD_TARGET"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring dbus-x11 binutils libarchive-tools xvfb x11-utils
      - *install-nfpm
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Import optional Windows code-signing certificate
        if: runner.os == 'Windows' && env.RELEASE_CHANNEL != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hasCertificate = ![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasPassword = ![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) { throw 'Set both Windows code-signing secrets or neither' }
          if (!$hasCertificate) { exit 0 }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'private-ai-proxy-code-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $certificates = @()
          try {
            $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword)
            $signingCertificates = @($certificates | Where-Object { $_.HasPrivateKey })
            if ($signingCertificates.Count -ne 1 -or [string]::IsNullOrWhiteSpace($signingCertificates[0].Thumbprint)) {
              throw 'Expected exactly one Windows certificate with a private key'
            }
            $now = Get-Date
            if ($signingCertificates[0].NotBefore -gt $now -or $signingCertificates[0].NotAfter -le $now) {
              throw 'Windows code-signing certificate is not currently valid'
            }
            "WINDOWS_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
            "WINDOWS_CERTIFICATE_IMPORTED_THUMBPRINTS=$(($certificates.Thumbprint | Where-Object { $_ }) -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append
            "WINDOWS_CERTIFICATE_THUMBPRINT=$($signingCertificates[0].Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          } catch {
            foreach ($certificate in $certificates) {
              if (![string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
                Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -ErrorAction SilentlyContinue
              }
            }
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
            throw
          }
      - name: Validate updater release configuration
        if: env.RELEASE_CHANNEL != ''
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Prepare Apple notarization key
        if: runner.os == 'macOS' && env.RELEASE_CHANNEL != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required macOS release secret: %s\n' "${missing[@]}"
            exit 1
          fi

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build production macOS package
        if: runner.os == 'macOS' && env.RELEASE_CHANNEL != ''
        working-directory: apps/desktop
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.select-platforms.outputs.channel && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.select-platforms.outputs.channel && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npm run dist -- --bundles ${{ matrix.bundles }}

      - name: Build ad-hoc macOS package
        if: runner.os == 'macOS' && env.RELEASE_CHANNEL == ''
        working-directory: apps/desktop
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run dist -- --bundles ${{ matrix.bundles }}

      - name: Build non-macOS package
        if: runner.os != 'macOS'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.select-platforms.outputs.channel && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.select-platforms.outputs.channel && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npm run dist -- --bundles ${{ matrix.bundles }}

      # Tauri writes SemVer prereleases verbatim, which dpkg and rpm order after
      # the stable release. nfpm packages its payload as DEB, RPM and Arch
      # packages with native versions; the updater signs the final DEB and RPM.
      - name: Package Linux desktop
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.select-platforms.outputs.channel && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.select-platforms.outputs.channel && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: node scripts/package-linux.mjs "$PAP_BUNDLE_DIR" "$VERSION" '${{ matrix.cli_arch }}' release

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_THUMBPRINT != ''
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            Get-ChildItem "$env:PAP_BUNDLE_DIR/nsis/*.exe"
            Get-ChildItem 'src-tauri/binaries/*.exe'
          )
          if ($files.Count -ne 4) { throw "Expected one installer and three standalone binaries, found $($files.Count)" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) has Authenticode status $($signature.Status)" }
          }

      - name: Verify macOS executables
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="$(find "$PAP_BUNDLE_DIR/macos" -type d -name '*.app' -print -quit)"
          test -n "$app_bundle"
          architecture=arm64
          if [[ "$PAP_BUILD_TARGET" == x86_64-apple-darwin ]]; then architecture=x86_64; fi
          for binary in private-ai-proxy-desktop private-ai-proxy private-ai-proxy-service private-ai-proxy-helper; do
            test "$(xcrun lipo -archs "$app_bundle/Contents/MacOS/$binary")" = "$architecture"
          done
          if [[ "$architecture" == x86_64 ]] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          arch "-$architecture" "$app_bundle/Contents/MacOS/private-ai-proxy" --version
          arch "-$architecture" "$app_bundle/Contents/MacOS/private-ai-proxy-service" --version
          arch "-$architecture" "$app_bundle/Contents/MacOS/private-ai-proxy-helper" --help

      - name: Verify Linux glibc compatibility
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          baseline=2.35
          scratch="$(mktemp -d "$RUNNER_TEMP/glibc-baseline.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          dpkg-deb -x "release/private-ai-proxy-${VERSION}-linux-${{ matrix.cli_arch }}.deb" "$scratch"
          executables=(
            "$scratch/usr/bin/private-ai-proxy-desktop"
            "$scratch/usr/bin/private-ai-proxy"
            "$scratch/usr/bin/private-ai-proxy-service"
            "$scratch/usr/bin/private-ai-proxy-helper"
          )
          for executable in "${executables[@]}"; do
            test -x "$executable"
            highest="$(
              readelf --version-info "$executable" |
                grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' |
                sed 's/^GLIBC_//' |
                sort -Vu |
                tail -n 1
            )"
            test -n "$highest"
            if [[ "$(printf '%s\n' "$baseline" "$highest" | sort -V | tail -n 1)" != "$baseline" ]]; then
              echo "$(basename "$executable") requires GLIBC_$highest; maximum supported version is GLIBC_$baseline" >&2
              exit 1
            fi
            echo "$(basename "$executable"): GLIBC_$highest"
          done

      - name: Package CLI-only distribution
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          target_triple="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$target_triple"
          source_args=()
          if [[ '${{ runner.os }}' == macOS ]]; then
            target_triple="$PAP_BUILD_TARGET"
            app_bundle="$(find "$PAP_BUNDLE_DIR/macos" -type d -name '*.app' -print -quit)"
            test -n "$app_bundle"
            source_args=(--source "$app_bundle/Contents/MacOS")
          fi
          node scripts/package-cli.mjs \
            --platform '${{ matrix.cli_platform }}' \
            --arch '${{ matrix.cli_arch }}' \
            --version "$version" \
            --target-triple "$target_triple" \
            --output release "${source_args[@]}"

      - name: Check CLI-only archive without UI
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          base="private-ai-proxy-cli-${version}-${{ matrix.cli_platform }}-${{ matrix.cli_arch }}"
          scratch="$(mktemp -d "$RUNNER_TEMP/cli-archive.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          if [[ '${{ matrix.cli_platform }}' == windows ]]; then
            native_tar="$(cygpath -u "$WINDIR")/System32/tar.exe"
            "$native_tar" -x -f "release/${base}.zip" -C "$scratch"
          else
            tar -x -z -f "release/${base}.tar.gz" -C "$scratch"
          fi
          node scripts/cli-package-smoke.mjs "$scratch/$base" "$version"

      - name: Verify Windows installer startup gate
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = Join-Path $env:LOCALAPPDATA 'tauri/NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $makensis -PathType Leaf)) { throw 'Tauri-managed makensis.exe is missing' }
          node scripts/windows-startup-gate-smoke.mjs $makensis
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup-gate smoke failed' }

      - name: Check Linux packages without installation
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          scratch="$(mktemp -d "$RUNNER_TEMP/linux-native.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          extract() {
            mkdir "$scratch/$2"
            case "$1" in
              *.deb) dpkg-deb -x "$1" "$scratch/$2" ;;
              *) bsdtar -xf "$1" -C "$scratch/$2" ;;
            esac
          }
          for suffix in deb rpm pkg.tar.zst; do
            extract "release/private-ai-proxy-cli-${version}-linux-${{ matrix.cli_arch }}.$suffix" "cli-$suffix"
            node scripts/cli-package-smoke.mjs "$scratch/cli-$suffix/usr/libexec/private-ai-proxy" "$version" "$scratch/cli-$suffix/usr/bin"
            test "$(readlink "$scratch/cli-$suffix/usr/bin/private-ai-proxy")" = ../libexec/private-ai-proxy/private-ai-proxy
          done
          extract "release/private-ai-proxy-${version}-linux-${{ matrix.cli_arch }}.pkg.tar.zst" desktop-arch
          expected_pkgver="$(node --input-type=module -e 'import { releaseVersionParts } from "./scripts/package-linux.mjs"; process.stdout.write(`${releaseVersionParts(process.argv[1]).arch}-1`)' "$version")"
          grep -Fx "pkgver = $expected_pkgver" "$scratch/cli-pkg.tar.zst/.PKGINFO"
          grep -Fx 'pkgname = private-ai-proxy' "$scratch/desktop-arch/.PKGINFO"
          grep -Fx "pkgver = $expected_pkgver" "$scratch/desktop-arch/.PKGINFO"
          test "$(cat "$scratch/desktop-arch/usr/share/private-ai-proxy/package-manager")" = pacman
          node scripts/packaged-sidecars-smoke.mjs "$scratch/desktop-arch/usr/bin"
      - name: Notarize production macOS disk image
        if: runner.os == 'macOS' && env.RELEASE_CHANNEL != ''
        working-directory: apps/desktop
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          dmg="$(find "$PAP_BUNDLE_DIR/dmg" -type f -name '*.dmg' -print -quit)"
          test -f "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          cli_scratch="$(mktemp -d "$RUNNER_TEMP/pap-cli-notary.XXXXXX")"
          trap 'rm -rf "$cli_scratch"' EXIT
          tar -xzf "release/private-ai-proxy-cli-${VERSION}-macos-${{ matrix.cli_arch }}.tar.gz" -C "$cli_scratch"
          cli_directory="$cli_scratch/private-ai-proxy-cli-${VERSION}-macos-${{ matrix.cli_arch }}"
          for executable in "$cli_directory"/*; do codesign --verify --strict "$executable"; done
          ditto -c -k --keepParent "$cli_directory" "$cli_scratch/cli.zip"
          xcrun notarytool submit "$cli_scratch/cli.zip" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait

      - name: Test macOS backend library
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          cargo test --release --locked --package private-ai-proxy-core --target "$(rustc -vV | sed -n 's/^host: //p')" --lib
          cargo test --release --locked --package private-ai-proxy-runtime --target "$(rustc -vV | sed -n 's/^host: //p')" --lib
          cargo test --release --locked --package private-ai-proxy-runtime --target "$(rustc -vV | sed -n 's/^host: //p')" --lib -- --ignored legacy_keychain_import_round_trip

      - name: Test Windows desktop libraries
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --locked --package private-ai-proxy-agent-bridge --lib
          cargo test --release --locked --package private-ai-proxy-core --lib
          cargo test --release --locked --package private-ai-proxy-runtime --lib
          cargo test --release --locked --package private-ai-proxy-desktop --lib

      - name: Check installed Windows sidecars without UI
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "$env:PAP_BUNDLE_DIR/nsis/*.exe")
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Tauri Installed Check'
          if (Test-Path $installDir) { throw 'Install check directory already exists' }
          function Run-Installer($executable, $arguments) {
            $process = Start-Process -FilePath $executable -ArgumentList $arguments -PassThru
            if (!$process.WaitForExit(60000)) {
              & taskkill.exe /PID $process.Id /T /F
              throw 'Installer timed out'
            }
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          }
          try {
            Run-Installer $installers[0].FullName "/S /D=$installDir"
            if (![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
              $executables = @(Get-ChildItem "$installDir/*.exe" | Where-Object { $_.Name -ne 'uninstall.exe' })
              if ($executables.Count -ne 4) { throw "Expected four installed executables, found $($executables.Count)" }
              foreach ($executable in $executables) {
                $signature = Get-AuthenticodeSignature $executable.FullName
                if ($signature.Status -ne 'Valid') { throw "$($executable.Name) has Authenticode status $($signature.Status)" }
              }
            }
            node scripts/packaged-sidecars-smoke.mjs $installDir
            if ($LASTEXITCODE -ne 0) { throw 'Installed sidecar checks failed' }
            $registration = (& "$installDir/private-ai-proxy.exe" --json cli status | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or !$registration.installed) { throw 'NSIS did not register private-ai-proxy in the user PATH' }
            if ([IO.Path]::GetFullPath($registration.commandPath) -ne [IO.Path]::GetFullPath("$installDir/private-ai-proxy.exe")) {
              throw 'private-ai-proxy reported an unexpected registered command path'
            }
            # Replay the in-app updater's passive installer over a running backend.
            # Launch the service directly: CI runner jobs forbid the CLI's detached breakaway spawn.
            function Start-Backend {
              Start-Process -FilePath "$installDir/private-ai-proxy-service.exe" -WindowStyle Hidden | Out-Null
              for ($attempt = 0; $attempt -lt 60; $attempt++) {
                $status = (& "$installDir/private-ai-proxy.exe" --json service status | ConvertFrom-Json)
                if ($status.backend) { return $status.backend }
                Start-Sleep -Milliseconds 500
              }
              throw 'The installed backend did not start'
            }
            $env:PRIVATE_AI_PROXY_HOME = Join-Path $env:RUNNER_TEMP 'pap-update-home'
            try {
              New-Item -ItemType Directory -Force $env:PRIVATE_AI_PROXY_HOME | Out-Null
              Start-Backend | Out-Null
              Run-Installer $installers[0].FullName "/P /UPDATE /D=$installDir"
              $stopped = (& "$installDir/private-ai-proxy.exe" --json service status | ConvertFrom-Json)
              if ($LASTEXITCODE -ne 0 -or $stopped.status -ne 'not_running') { throw 'The update installer left the previous backend running' }
              $restarted = Start-Backend
              if (!$restarted.executable.EndsWith('Tauri Installed Check\private-ai-proxy-service.exe', [StringComparison]::OrdinalIgnoreCase)) {
                throw "The updated backend restarted from $($restarted.executable)"
              }
              $registration = (& "$installDir/private-ai-proxy.exe" --json cli status | ConvertFrom-Json)
              if ($LASTEXITCODE -ne 0 -or !$registration.installed) { throw 'The update installer removed the private-ai-proxy PATH registration' }
            } finally {
              & "$installDir/private-ai-proxy.exe" --yes service stop | Out-Null
              Remove-Item Env:PRIVATE_AI_PROXY_HOME
            }
            $env:PAP_TEST_HELPER_PATH = "$installDir/private-ai-proxy-helper.exe"
            cargo test --release --locked --package private-ai-proxy-agent-bridge --lib -- --ignored hermes_windows_installed_command_round_trip
            if ($LASTEXITCODE -ne 0) { throw 'Hermes credential command failed' }
            cargo test --release --locked --package private-ai-proxy-runtime --lib -- --ignored legacy_keychain_import_round_trip
            if ($LASTEXITCODE -ne 0) { throw 'Credential Manager import check failed' }
          } finally {
            if (Test-Path "$installDir/uninstall.exe") {
              Run-Installer "$installDir/uninstall.exe" "/S _?=$installDir"
            }
            foreach ($binary in @('private-ai-proxy-desktop.exe', 'private-ai-proxy.exe', 'pap.cmd', 'aci.cmd', 'private-ai-proxy-service.exe', 'private-ai-proxy-helper.exe')) {
              if (Test-Path "$installDir/$binary") { throw "Uninstall left $binary" }
            }
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            if (($userPath -split ';') -contains $installDir) { throw 'Uninstall left the NSIS-owned private-ai-proxy PATH entry' }
          }

      - name: Check installed Linux sidecars without UI
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          packages=("release/private-ai-proxy-${VERSION}-linux-${{ matrix.cli_arch }}.deb")
          package=$(dpkg-deb -f "${packages[0]}" Package)
          if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then
            echo 'Refusing to replace an existing installation'
            exit 1
          fi
          scratch=$(mktemp -d "$RUNNER_TEMP/tauri-installed.XXXXXX")
          cleanup() {
            local status=$?
            if dpkg-query -W "$package" >/dev/null 2>&1; then
              sudo apt-get remove -y "$package" || status=1
            fi
            for binary in private-ai-proxy-desktop private-ai-proxy pap aci private-ai-proxy-service private-ai-proxy-helper; do
              if [[ -e "/usr/bin/$binary" ]]; then status=1; fi
            done
            rm -rf "$scratch"
            return "$status"
          }
          trap cleanup EXIT
          # Replay the in-app updater's transaction over the published stable
          # package. The updater stops its own backend first: packages up to
          # 0.1.7-beta.n refuse to upgrade while another of their processes runs.
          stable_url="$(curl -fsSL https://github.com/Dstack-TEE/private-ai-gateway/releases/download/desktop-updates-stable/latest.json | jq -er --arg target "linux-$(uname -m)-deb" '.platforms[$target].url')"
          curl -fsSL -o "$scratch/stable.deb" "$stable_url"
          sudo apt-get install -y "$scratch/stable.deb"
          sudo dpkg -i "${packages[0]}"
          test "$(dpkg-query -W -f='${Version}' "$package")" = "$(dpkg-deb -f "${packages[0]}" Version)"
          node scripts/packaged-sidecars-smoke.mjs /usr/bin
          export TAURI_CHECK_KEYRING_HOME="$scratch"
          export XDG_RUNTIME_DIR="$scratch/runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euc '
            HOME="$TAURI_CHECK_KEYRING_HOME" gnome-keyring-daemon --foreground --unlock --components=secrets <<< ci-check-only &
            keyring_pid=$!
            trap "kill $keyring_pid 2>/dev/null || true; wait $keyring_pid || true" EXIT
            gdbus wait --session --timeout 10 org.freedesktop.secrets
            cargo test --release --locked --package private-ai-proxy-runtime --lib -- --ignored legacy_keychain_import_round_trip
          '
          # Install again over the running app and backend, as later in-app updates do.
          xvfb-run -a dbus-run-session -- node scripts/native-backend-smoke.mjs /usr/bin sudo dpkg -i "${packages[0]}"
      - name: Stage and inspect macOS package
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          app_bundle="$(find "$PAP_BUNDLE_DIR/macos" -type d -name '*.app' -print -quit)"
          dmg="$(find "$PAP_BUNDLE_DIR/dmg" -type f -name '*.dmg' -print -quit)"
          test -d "$app_bundle"
          test -f "$dmg"
          test -x "$app_bundle/Contents/MacOS/private-ai-proxy"
          test -x "$app_bundle/Contents/MacOS/private-ai-proxy-service"
          test -x "$app_bundle/Contents/MacOS/private-ai-proxy-helper"
          test -f "$app_bundle/Contents/Resources/Assets.car"
          test -f "$app_bundle/Contents/Resources/icon.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app_bundle/Contents/Info.plist")" = Icon
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          codesign_details="$(codesign --display --verbose=4 "$app_bundle" 2>&1)"
          if [[ -n "$RELEASE_CHANNEL" ]]; then
            grep -q '^Authority=Developer ID Application:' <<<"$codesign_details"
            if grep -q '^Signature=adhoc$' <<<"$codesign_details"; then
              echo 'Production package was signed ad-hoc instead of with Developer ID'
              exit 1
            fi
            xcrun stapler validate "$app_bundle"
            xcrun stapler validate "$dmg"
            spctl --assess --type execute --verbose=4 "$app_bundle"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          else
            grep -q '^Signature=adhoc$' <<<"$codesign_details"
          fi
          registration_home="$(mktemp -d "$RUNNER_TEMP/pap-registration.XXXXXX")"
          registration_log="$RUNNER_TEMP/private-ai-proxy-registration.log"
          registration_stop_log="$RUNNER_TEMP/private-ai-proxy-registration-stop.log"
          registration_pid=
          cleanup_registration() {
            local status=$?
            trap - EXIT
            if [[ -n "$registration_pid" ]] && kill -0 "$registration_pid" 2>/dev/null; then
              kill -TERM "$registration_pid" 2>/dev/null || true
              for _ in {1..50}; do
                kill -0 "$registration_pid" 2>/dev/null || break
                sleep 0.1
              done
              if kill -0 "$registration_pid" 2>/dev/null; then
                kill -KILL "$registration_pid" 2>/dev/null || true
                for _ in {1..50}; do
                  kill -0 "$registration_pid" 2>/dev/null || break
                  sleep 0.1
                done
              fi
            fi
            if [[ -n "$registration_pid" ]]; then
              if kill -0 "$registration_pid" 2>/dev/null; then
                echo 'Packaged app did not exit during registration smoke cleanup.' >&2
                status=1
              else
                wait "$registration_pid" 2>/dev/null || true
              fi
            fi
            if HOME="$registration_home" PRIVATE_AI_PROXY_HOME="$registration_home" \
              "$app_bundle/Contents/MacOS/private-ai-proxy" --yes service stop >"$registration_stop_log" 2>&1; then
              rm -rf "$registration_home"
            else
              echo "Packaged backend cleanup failed; isolated state retained at $registration_home" >&2
              cat "$registration_log" >&2 || true
              cat "$registration_stop_log" >&2 || true
              status=1
            fi
            rm -f "$registration_log" "$registration_stop_log"
            return "$status"
          }
          trap cleanup_registration EXIT
          registration_before="$(HOME="$registration_home" PRIVATE_AI_PROXY_HOME="$registration_home" \
            "$app_bundle/Contents/MacOS/private-ai-proxy" --json cli status)"
          node -e 'const value = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (value.installed !== false) process.exit(1)' \
            <<<"$registration_before"
          HOME="$registration_home" PRIVATE_AI_PROXY_HOME="$registration_home" \
            "$app_bundle/Contents/MacOS/private-ai-proxy-desktop" >"$registration_log" 2>&1 &
          registration_pid=$!
          for _ in {1..100}; do
            [[ -L "$registration_home/.local/bin/private-ai-proxy" ]] && break
            if ! kill -0 "$registration_pid" 2>/dev/null; then
              cat "$registration_log"
              exit 1
            fi
            sleep 0.1
          done
          test -L "$registration_home/.local/bin/pap"
          test "$(readlink "$registration_home/.local/bin/pap")" = "$(realpath "$app_bundle/Contents/MacOS/private-ai-proxy")"
          test -L "$registration_home/.local/bin/aci"
          test "$(readlink "$registration_home/.local/bin/aci")" = "$(realpath "$app_bundle/Contents/MacOS/private-ai-proxy")"
          test -L "$registration_home/.local/bin/private-ai-proxy"
          test "$(readlink "$registration_home/.local/bin/private-ai-proxy")" = "$(realpath "$app_bundle/Contents/MacOS/private-ai-proxy")"
          registration_after="$(HOME="$registration_home" PRIVATE_AI_PROXY_HOME="$registration_home" \
            "$app_bundle/Contents/MacOS/private-ai-proxy" --json cli status)"
          node -e 'const value = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (value.installed !== true) process.exit(1)' \
            <<<"$registration_after"
          kill -0 "$registration_pid"
          cleanup_registration
          hdiutil verify "$dmg"
          node scripts/verify-dmg-layout.mjs "$dmg"
          base="private-ai-proxy-${VERSION}-macos-${{ matrix.cli_arch }}"
          cp "$dmg" "release/$base.dmg"
          if [[ -n "$RELEASE_CHANNEL" ]]; then
            updater="$(find "$PAP_BUNDLE_DIR/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
            test -n "$updater"
            mv "$updater" "release/$base.app.tar.gz"
            mv "$updater.sig" "release/$base.app.tar.gz.sig"
          fi
      - name: Upload desktop package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: private-ai-proxy-${{ env.RELEASE_CHANNEL || 'test' }}-${{ env.VERSION }}-${{ github.sha }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/private-ai-proxy-*
            ${{ env.PAP_BUNDLE_DIR }}/nsis/*.exe
            ${{ env.PAP_BUNDLE_DIR }}/macos/*.tar.gz
            ${{ env.PAP_BUNDLE_DIR }}/macos/*.sig
            ${{ env.PAP_BUNDLE_DIR }}/nsis/*.sig

      - name: Remove Apple notarization key
        if: always() && runner.os == 'macOS' && env.RELEASE_CHANNEL != ''
        shell: bash
        run: rm -f "${APPLE_API_KEY_PATH:-}"
      - name: Remove Windows code-signing certificate
        if: always() && runner.os == 'Windows' && env.RELEASE_CHANNEL != ''
        shell: pwsh
        run: |
          if (![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_IMPORTED_THUMBPRINTS)) {
            foreach ($thumbprint in $env:WINDOWS_CERTIFICATE_IMPORTED_THUMBPRINTS.Split(';')) {
              Remove-Item "Cert:\CurrentUser\My\$thumbprint" -ErrorAction SilentlyContinue
            }
          }
          if (![string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item $env:WINDOWS_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }
      - *save-rust-cache

  release:
    needs: [select-platforms, package, mac-app-store]
    if: ${{ always() && needs.select-platforms.outputs.channel != '' && needs.package.result == 'success' && (needs.mac-app-store.result == 'success' || needs.mac-app-store.result == 'skipped') }}
    environment: desktop-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.select-platforms.outputs.channel }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.select-platforms.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: private-ai-proxy-*
          path: release-artifacts
          merge-multiple: false
      - name: Install release tooling
        working-directory: apps/desktop
        run: npm ci --ignore-scripts
      # release-please created the draft with the changelog as its notes.
      - name: Attach signed assets and the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          node apps/desktop/scripts/create-update-manifest.mjs release-artifacts "$VERSION" "$GITHUB_REPOSITORY" "$CHANNEL" all
          node apps/desktop/scripts/release-assets.mjs release-artifacts > release-assets.list
          mapfile -d '' assets < release-assets.list
          gh release upload "$TAG" "${assets[@]}" --clobber
      - name: Publish desktop version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=true latest=false
          if [[ "$CHANNEL" == stable ]]; then prerelease=false latest=true; fi
          gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$latest" --title "Private AI Proxy v$VERSION"

  update-feed:
    needs: release
    if: needs.release.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-update-feed.yml
    with:
      tag: ${{ github.ref_name }}

  publish-npm:
    needs: update-feed
    if: needs.update-feed.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch trusted npm publisher
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          workflow=private-ai-proxy-npm.yml
          request_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          gh workflow run "$workflow" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            -f release_tag="$RELEASE_TAG" \
            -f publish=true \
            -f request_id="$request_id"

          run_id=
          for _ in {1..30}; do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,displayTitle,headSha)"
            run_id="$(jq -r \
              --arg title "[$request_id]" \
              --arg sha "$GITHUB_SHA" \
              '[.[] | select(.headSha == $sha and (.displayTitle | endswith($title)))][0].databaseId // empty' \
              <<<"$runs")"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "Timed out locating the dispatched npm workflow" >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
