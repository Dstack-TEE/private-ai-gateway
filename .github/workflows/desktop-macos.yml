name: Desktop macOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-macos.yml'
      - 'apps/desktop/**'
      - 'src/aci/**'
      - 'src/bin/aci/**'
      - 'src/http/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  push:
    branches:
      - feat/private-ai-gateway-desktop-mvp
    paths:
      - '.github/workflows/desktop-macos.yml'
      - 'apps/desktop/**'
      - 'src/aci/**'
      - 'src/bin/aci/**'
      - 'src/http/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Resolved before any step that can fail, so the diagnostics upload
      # below always has a real name.
      - name: Beta artifact metadata
        id: beta
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "shortsha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/gateway -> target
            apps/desktop/src-tauri -> target

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Verify desktop source
        run: |
          npm --prefix apps/desktop run check
          npm --prefix apps/desktop run build
          cargo fmt --manifest-path apps/desktop/gateway/Cargo.toml -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Renderer smoke (Playwright, stateful mock)
        working-directory: apps/desktop
        run: |
          npx playwright install chromium
          npm run test:renderer

      - name: Build bundled ACI sidecar
        working-directory: apps/desktop
        run: npm run build:native

      - name: Test ACI sidecar
        run: cargo test --locked --bin aci

      - name: Test local gateway and Tauri backend
        run: |
          cargo test --locked --manifest-path apps/desktop/gateway/Cargo.toml
          cargo test --locked --manifest-path apps/desktop/gateway/Cargo.toml -- --ignored keyring_round_trip
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Package Tauri app and DMG
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Stage macOS packages
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release test-results
          app_bundle="$(find src-tauri/target/release/bundle/macos -type d -name 'Private AI Gateway.app' -print -quit)"
          dmg="$(find src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -d "$app_bundle"
          test -f "$dmg"
          cp "$dmg" release/
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" \
            "release/Private-AI-Gateway-${RUNNER_ARCH}.zip"

      # Live-service steps are diagnostics for the beta package: an outage of
      # the public service must not block producing the artifact below.
      - name: Run bundled ACI live smoke
        continue-on-error: true
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="$(find src-tauri/target/release/bundle/macos -type d -name 'Private AI Gateway.app' -print -quit)"
          aci="$(find "$app_bundle/Contents" -type f -name 'aci*' -perm -111 -print -quit)"
          test -x "$aci"
          node scripts/live-sidecar-smoke.mjs \
            "$aci" \
            "https://tee.redpill.ai" \
            "test-results/live-service.json"

      - name: Launch tray app and capture menu bar
        continue-on-error: true
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="$(find src-tauri/target/release/bundle/macos -type d -name 'Private AI Gateway.app' -print -quit)"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Contents/Info.plist")"
          open "$app_bundle" --stdout test-results/app.stdout.log --stderr test-results/app.stderr.log
          sleep 5
          app_pid="$(pgrep -x "$executable_name" | head -1 || true)"
          if [[ -z "$app_pid" ]]; then
            cat test-results/app.stdout.log || true
            cat test-results/app.stderr.log || true
            exit 1
          fi
          screencapture -x test-results/macos-menu-bar.png
          osascript -e 'tell application "Private AI Gateway" to quit' || kill -TERM "$app_pid"

      - name: Inspect macOS artifacts
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          report="release/macos-inspection.txt"
          app_bundle="$(find src-tauri/target/release/bundle/macos -type d -name 'Private AI Gateway.app' -print -quit)"
          dmg="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip="$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          aci="$(find "$app_bundle/Contents" -type f -name 'aci*' -perm -111 -print -quit)"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Contents/Info.plist")"
          executable="$app_bundle/Contents/MacOS/$executable_name"

          test -d "$app_bundle"
          test -x "$executable"
          test -x "$aci"
          test -x "$app_bundle/Contents/MacOS/private-ai-gateway-helper"
          test -f "$dmg"
          test -f "$zip"

          {
            echo "runner_arch=$RUNNER_ARCH"
            echo "app_bundle=$app_bundle"
            echo "dmg=$dmg"
            echo "zip=$zip"
            echo "aci=$aci"
            echo "app_bytes=$(du -sk "$app_bundle" | awk '{print $1 * 1024}')"
            echo "dmg_bytes=$(stat -f '%z' "$dmg")"
            echo "zip_bytes=$(stat -f '%z' "$zip")"
            file "$executable"
            file "$aci"
            "$aci" --help | sed -n '1,12p'
            hdiutil verify "$dmg"
            unzip -tq "$zip"

            mount_dir="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
            test -d "$mount_dir/Private AI Gateway.app"
            test -L "$mount_dir/Applications"
            hdiutil detach "$mount_dir"
            rmdir "$mount_dir"

            echo
            echo "codesign verification:"
            codesign --verify --deep --strict --verbose=2 "$app_bundle" || true
            codesign -dvvv "$app_bundle" || true

            echo
            echo "Gatekeeper assessment:"
            spctl --assess --type execute --verbose=4 "$app_bundle" || true
          } 2>&1 | tee "$report"

      - name: Upload macOS package and evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: private-ai-gateway-beta-${{ steps.beta.outputs.version }}-${{ steps.beta.outputs.shortsha }}-macos-arm64
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/macos-inspection.txt
            apps/desktop/test-results/live-service.json
            apps/desktop/test-results/macos-menu-bar.png
            apps/desktop/test-results/app.*.log
            apps/desktop/playwright-artifacts/

  check-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      # The gateway crate, helper, and Tauri backend are checked on their
      # declared MSRV (1.89). The root ACI sidecar follows the root workspace's
      # newer toolchain requirements.
      - name: Install Rust (MSRV for the gateway crate)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - name: Install Rust (root workspace)
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/gateway -> target
            apps/desktop/src-tauri -> target

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev gnome-keyring dbus-x11 libsecret-tools

      - name: Test local gateway crate (MSRV 1.89)
        run: cargo +1.89 test --locked --manifest-path apps/desktop/gateway/Cargo.toml

      - name: Stage native sidecars for the Tauri check
        env:
          RUSTUP_TOOLCHAIN: stable
        run: node apps/desktop/scripts/bundle-native.mjs --debug

      - name: Credential store smoke (Windows Credential Manager)
        if: runner.os == 'Windows'
        run: cargo +1.89 test --locked --manifest-path apps/desktop/gateway/Cargo.toml -- --ignored keyring_round_trip

      - name: Credential store smoke (Linux Secret Service)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          cat > "$RUNNER_TEMP/keyring-smoke.sh" <<'SMOKE'
          set -euo pipefail
          eval "$(printf 'ci-keyring-password' | gnome-keyring-daemon --unlock --components=secrets)"
          export GNOME_KEYRING_CONTROL
          printf 'bootstrap' | secret-tool store --label 'CI bootstrap' service pag-ci probe bootstrap
          test "$(secret-tool lookup service pag-ci probe bootstrap)" = bootstrap
          cargo +1.89 test --locked --manifest-path apps/desktop/gateway/Cargo.toml -- --ignored keyring_round_trip
          SMOKE
          dbus-run-session -- bash "$RUNNER_TEMP/keyring-smoke.sh"

      - name: Check Tauri backend (MSRV 1.89)
        run: cargo +1.89 check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
