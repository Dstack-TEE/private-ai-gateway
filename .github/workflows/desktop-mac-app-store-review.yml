name: Desktop Mac App Store Review

on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store version to submit
        required: true
        type: string
      build_number:
        description: Valid App Store Connect CFBundleVersion to submit
        required: true
        type: string
      whats_new:
        description: 'Optional What''s New override; separate lines with \n or " • "'
        required: false
        type: string
      dry_run:
        description: Plan the staging without changing App Store Connect
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-mac-app-store-review-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    environment: app-store-review
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ASC_REVIEW_DRY_RUN: ${{ inputs.dry_run }}
      ASC_REVIEW_VERSION: ${{ inputs.version }}
    steps:
      - name: Require the protected main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "This workflow may run only from refs/heads/main (got $GITHUB_REF)." >&2
            exit 1
          fi

      - name: Initialize temporary review workspace
        shell: bash
        run: |
          set -euo pipefail
          ASC_REVIEW_ROOT="$RUNNER_TEMP/app-store-review"
          mkdir -p "$ASC_REVIEW_ROOT"
          printf 'ASC_REVIEW_ROOT=%s\n' "$ASC_REVIEW_ROOT" >> "$GITHUB_ENV"

      - name: Validate release inputs
        shell: bash
        env:
          REVIEW_VERSION: ${{ inputs.version }}
          REVIEW_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          build_number='^[0-9]+(\.[0-9]+){0,2}$'
          [[ "$REVIEW_VERSION" =~ $semver ]] || { echo 'version must be a semantic version' >&2; exit 1; }
          [[ "$REVIEW_BUILD_NUMBER" =~ $build_number ]] || { echo 'build_number must contain one to three integer components' >&2; exit 1; }
          [[ "${#REVIEW_BUILD_NUMBER}" -le 18 ]] || { echo 'build_number must be at most 18 characters' >&2; exit 1; }

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/asc # zizmor: ignore[ self-repository ]

      - name: Prepare App Store Connect review key
        shell: bash
        env:
          ASC_REVIEW_KEY_ID: ${{ secrets.ASC_REVIEW_KEY_ID }}
          ASC_REVIEW_PRIVATE_KEY: ${{ secrets.ASC_REVIEW_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${ASC_REVIEW_KEY_ID:?Missing ASC_REVIEW_KEY_ID}"
          : "${ASC_REVIEW_PRIVATE_KEY:?Missing ASC_REVIEW_PRIVATE_KEY}"
          key_directory="$ASC_REVIEW_ROOT/private_keys"
          key_path="$key_directory/AuthKey_${ASC_REVIEW_KEY_ID}.p8"
          umask 077
          mkdir -p "$key_directory"
          printf '%s' "$ASC_REVIEW_PRIVATE_KEY" > "$key_path"

      - name: Resolve app, valid build and previous live version
        shell: bash
        env: &asc-review-auth
          ASC_KEY_ID: ${{ secrets.ASC_REVIEW_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_REVIEW_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/app-store-review/private_keys/AuthKey_${{ secrets.ASC_REVIEW_KEY_ID }}.p8
          ASC_BYPASS_KEYCHAIN: '1'
          ASC_STRICT_AUTH: '1'
          ASC_TELEMETRY_DISABLED: '1'
          REVIEW_VERSION: ${{ inputs.version }}
          REVIEW_BUILD_NUMBER: ${{ inputs.build_number }}
          JQ_BUILD_ID: |
            if (.data | type) != "array" or (.data | length) != 1
              or .data[0].attributes.processingState != "VALID"
              or (.data[0].id | type) != "string"
              or (.data[0].id | try (test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$") | not) catch true)
            then error("Expected exactly one VALID Mac App Store build")
            else .data[0].id
            end
          JQ_PREVIOUS_VERSION: |
            if (.items | type) != "array" or (.items | length) != 1
              or .items[0].attributes.appVersionState != "READY_FOR_DISTRIBUTION"
            then error("Expected exactly one previous live Mac App Store version")
            else .items[0].attributes.versionString
            end
          JQ_VERSION_ID: |
            if (.data | type) != "array" or (.data | length) != 1
              or (.data[0].id | type) != "string"
              or (.data[0].id | try (test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$") | not) catch true)
            then error("Expected exactly one staged Mac App Store version")
            else .data[0].id
            end
          JQ_LOCALIZATIONS: |
            (.data | type) == "array" and (.data | length) > 0
            and ((.data | map(.id) | map(select(type == "string" and length > 0)) | length) == (.data | length))
          JQ_RELEASE_TYPE_UPDATE: '.id == $version_id'
          JQ_RELEASE_TYPE_VERIFY: |
            (.data | type) == "array" and (.data | length) == 1
            and .data[0].id == $version_id
            and .data[0].attributes.releaseType == "MANUAL"
          JQ_DOCTOR: '(.summary | type == "object") and (.summary.blocking == 0) and (.summary.errors == 0)'
        run: |
          set -euo pipefail
          bundle_id="$(jq -er '.identifier | select(type == "string" and length > 0)' apps/desktop/src-tauri/tauri.conf.json)"
          asc --read-only auth doctor --output json > "$ASC_REVIEW_ROOT/auth.json"
          jq -e 'type == "object"' "$ASC_REVIEW_ROOT/auth.json" >/dev/null
          asc --read-only apps list --bundle-id "$bundle_id" --paginate --output json > "$ASC_REVIEW_ROOT/apps.json"
          app_id="$(jq -er --arg bundle_id "$bundle_id" '
            if (.data | type) != "array" or (.data | length) != 1
              or .data[0].attributes.bundleId != $bundle_id
              or (.data[0].id | test("^[0-9]+$") | not)
            then error("Expected exactly one App Store app matching the bundle identifier")
            else .data[0].id
            end
          ' "$ASC_REVIEW_ROOT/apps.json")"
          printf 'ASC_REVIEW_APP_ID=%s\n' "$app_id" >> "$GITHUB_ENV"

          asc --read-only builds list --app "$app_id" --platform MAC_OS \
            --version "$REVIEW_VERSION" --build-number "$REVIEW_BUILD_NUMBER" \
            --processing-state VALID --paginate --output json > "$ASC_REVIEW_ROOT/builds.json"
          build_id="$(jq -er "$JQ_BUILD_ID" "$ASC_REVIEW_ROOT/builds.json")"
          printf 'ASC_REVIEW_BUILD_ID=%s\n' "$build_id" >> "$GITHUB_ENV"

          asc --read-only versions list --app "$app_id" --platform MAC_OS \
            --state READY_FOR_DISTRIBUTION --latest --output json > "$ASC_REVIEW_ROOT/live-versions.json"
          previous_version="$(jq -er "$JQ_PREVIOUS_VERSION" "$ASC_REVIEW_ROOT/live-versions.json")"
          printf 'ASC_REVIEW_PREVIOUS_VERSION=%s\n' "$previous_version" >> "$GITHUB_ENV"

      - name: Extract What's New from the desktop changelog
        shell: bash
        env:
          REVIEW_VERSION: ${{ inputs.version }}
          REVIEW_WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          version = os.environ["REVIEW_VERSION"]
          override = os.environ["REVIEW_WHATS_NEW"]
          if override:
              text = override.replace("\\n", "\n").replace(" • ", "\n").strip()
          else:
              try:
                  changelog = Path("apps/desktop/CHANGELOG.md").read_text(encoding="utf-8")
              except OSError as error:
                  raise SystemExit(f"Unable to read desktop changelog: {error}") from error
              headings = list(re.finditer(r"^## \[([^\]]+)\][^\n]*$", changelog, re.MULTILINE))
              target = next((heading for heading in headings if heading.group(1) == version), None)
              if target is None:
                  raise SystemExit(f"No changelog section found for {version}")
              previous = next((heading for heading in headings
                               if heading.start() > target.start()
                               and re.fullmatch(r"\d+\.\d+\.\d+", heading.group(1))), None)
              changes = changelog[target.end():previous.start() if previous else len(changelog)]
              category = None
              entries = []
              for line in changes.splitlines():
                  if line.startswith("## "):
                      category = None
                  elif line.startswith("### "):
                      category = line[4:].strip()
                  elif category in {"Features", "Bug Fixes"}:
                      bullet = re.match(r"^[*+-]\s+(.+)$", line)
                      if not bullet:
                          continue
                      entry = bullet.group(1)
                      scope = re.match(r"^(?:\*\*)?([\w-]+):(?:\*\*)?\s*", entry)
                      if scope:
                          if scope.group(1) != "desktop":
                              continue
                          entry = entry[scope.end():]
                      entry = re.sub(r"\[([^\]]+)\]\([^)]*\)", r"\1", entry)
                      entry = re.sub(r"\s*\((?:#\d+|[0-9a-f]{7,40})\)", "", entry)
                      entry = re.sub(r"(?<!\w)(\*{1,2}|_{1,2}|~~)(.+?)\1(?!\w)", r"\2", entry)
                      entry = re.sub(r"`([^`]*)`", r"\1", entry).strip()
                      if entry:
                          entries.append(entry)
              text = "\n".join(f"• {entry}" for entry in dict.fromkeys(entries))
          if not text:
              raise SystemExit("What's New must not be empty")
          if len(text) > 4000:
              raise SystemExit("What's New exceeds Apple's 4000-character limit")
          output = Path(os.environ["ASC_REVIEW_ROOT"]) / "whats-new.txt"
          try:
              output.write_text(text + "\n", encoding="utf-8")
          except OSError as error:
              raise SystemExit(f"Unable to write What's New: {error}") from error
          PYTHON

      - name: Check review doctor before the dry run
        if: inputs.dry_run == true
        shell: bash
        env: *asc-review-auth
        run: |
          set -euo pipefail
          doctor_output="$ASC_REVIEW_ROOT/pre-stage-doctor.json"
          if asc --read-only review doctor --app "$ASC_REVIEW_APP_ID" --version "$ASC_REVIEW_VERSION" \
            --platform MAC_OS --output json > "$doctor_output" 2> "$ASC_REVIEW_ROOT/pre-stage-doctor.err"; then
            jq -e 'type == "object"' "$doctor_output" >/dev/null
            {
              printf '### Pre-stage review doctor\n\n```json\n'
              jq '.' "$doctor_output"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Pre-stage review doctor skipped because the target version is not staged yet.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage the App Store version
        shell: bash
        env: *asc-review-auth
        run: |
          set -euo pipefail
          if [[ "$ASC_REVIEW_DRY_RUN" == true ]]; then
            asc_prefix=(--read-only)
            stage_mode=(--dry-run)
          else
            asc_prefix=()
            stage_mode=(--confirm)
          fi
          asc "${asc_prefix[@]}" release stage --platform MAC_OS --app "$ASC_REVIEW_APP_ID" \
            --version "$ASC_REVIEW_VERSION" --build-id "$ASC_REVIEW_BUILD_ID" \
            --copy-metadata-from "$ASC_REVIEW_PREVIOUS_VERSION" \
            "${stage_mode[@]}" --output json > "$ASC_REVIEW_ROOT/stage.json"
          jq -e 'type == "object"' "$ASC_REVIEW_ROOT/stage.json" >/dev/null
          {
            printf '### App Store staging plan\n\n```json\n'
            jq '.' "$ASC_REVIEW_ROOT/stage.json"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ASC_REVIEW_DRY_RUN" == true ]]; then
            echo 'Dry run complete; no App Store Connect mutations were made.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve the staged version and localizations
        if: inputs.dry_run != true
        shell: bash
        env: *asc-review-auth
        run: |
          set -euo pipefail
          asc versions list --app "$ASC_REVIEW_APP_ID" --platform MAC_OS \
            --version "$ASC_REVIEW_VERSION" --paginate --output json > "$ASC_REVIEW_ROOT/target-versions.json"
          version_id="$(jq -er "$JQ_VERSION_ID" "$ASC_REVIEW_ROOT/target-versions.json")"
          printf 'ASC_REVIEW_VERSION_ID=%s\n' "$version_id" >> "$GITHUB_ENV"

          asc --read-only localizations list --version "$version_id" --paginate --output json > "$ASC_REVIEW_ROOT/localizations.json"
          jq -e "$JQ_LOCALIZATIONS" "$ASC_REVIEW_ROOT/localizations.json" >/dev/null

      - name: Set What's New for every localization
        if: inputs.dry_run != true
        shell: bash
        env: *asc-review-auth
        run: |
          set -euo pipefail
          while IFS= read -r localization_id; do
            output="$ASC_REVIEW_ROOT/localization-${localization_id}.json"
            asc localizations update --id "$localization_id" \
              --whats-new "$(cat "$ASC_REVIEW_ROOT/whats-new.txt")" --output json > "$output"
            jq -e --arg id "$localization_id" '.data.id == $id' "$output" >/dev/null
          done < <(jq -er '.data[].id' "$ASC_REVIEW_ROOT/localizations.json")

      - name: Set release after approval
        if: inputs.dry_run != true
        shell: bash
        env: *asc-review-auth
        run: |
          set -euo pipefail
          asc versions update --version-id "$ASC_REVIEW_VERSION_ID" \
            --release-type MANUAL --output json > "$ASC_REVIEW_ROOT/release-type.json"
          jq -e --arg version_id "$ASC_REVIEW_VERSION_ID" "$JQ_RELEASE_TYPE_UPDATE" "$ASC_REVIEW_ROOT/release-type.json" >/dev/null
          asc --read-only versions list --app "$ASC_REVIEW_APP_ID" --platform MAC_OS \
            --version "$ASC_REVIEW_VERSION" --paginate --output json > "$ASC_REVIEW_ROOT/release-type-verify.json"
          jq -e --arg version_id "$ASC_REVIEW_VERSION_ID" "$JQ_RELEASE_TYPE_VERIFY" "$ASC_REVIEW_ROOT/release-type-verify.json" >/dev/null

      - name: Require strict App Store readiness
        if: inputs.dry_run != true
        shell: bash
        env: *asc-review-auth
        run: |
          set -euo pipefail
          validate_status=0
          asc --read-only validate --app "$ASC_REVIEW_APP_ID" --version-id "$ASC_REVIEW_VERSION_ID" \
            --platform MAC_OS --strict --output json > "$ASC_REVIEW_ROOT/validate.json" || validate_status=$?
          jq -e 'type == "object"' "$ASC_REVIEW_ROOT/validate.json" >/dev/null
          if (( validate_status != 0 )); then
            echo "Strict App Store validation exited with status $validate_status." >&2
            exit "$validate_status"
          fi

      - name: Require a clean review doctor report
        if: inputs.dry_run != true
        shell: bash
        env: *asc-review-auth
        run: |
          set -euo pipefail
          doctor_status=0
          asc --read-only review doctor --app "$ASC_REVIEW_APP_ID" --version-id "$ASC_REVIEW_VERSION_ID" \
            --platform MAC_OS --output json > "$ASC_REVIEW_ROOT/doctor.json" || doctor_status=$?
          jq -e "$JQ_DOCTOR" "$ASC_REVIEW_ROOT/doctor.json" >/dev/null || {
            echo 'App Store review doctor reported blockers.' >&2
            exit 1
          }
          if (( doctor_status != 0 )); then
            echo "App Store review doctor exited with status $doctor_status." >&2
            exit "$doctor_status"
          fi
          {
            printf '### Review doctor\n\n```json\n'
            jq '.' "$ASC_REVIEW_ROOT/doctor.json"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Submit the version for App Review
        if: inputs.dry_run != true
        shell: bash
        env: *asc-review-auth
        run: |
          set -euo pipefail
          asc review submit --app "$ASC_REVIEW_APP_ID" --version-id "$ASC_REVIEW_VERSION_ID" \
            --build-id "$ASC_REVIEW_BUILD_ID" --platform MAC_OS --confirm --output json > "$ASC_REVIEW_ROOT/submit.json"
          jq -e 'type == "object"' "$ASC_REVIEW_ROOT/submit.json" >/dev/null

      - name: Record App Review status
        if: inputs.dry_run != true
        shell: bash
        env: *asc-review-auth
        run: |
          set -euo pipefail
          asc --read-only review status --app "$ASC_REVIEW_APP_ID" --version-id "$ASC_REVIEW_VERSION_ID" \
            --platform MAC_OS --output json > "$ASC_REVIEW_ROOT/status.json"
          jq -e 'type == "object"' "$ASC_REVIEW_ROOT/status.json" >/dev/null
          {
            printf '### App Review status\n\n```json\n'
            jq '.' "$ASC_REVIEW_ROOT/status.json"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove App Store Connect review key
        if: always()
        shell: bash
        run: rm -rf -- "$ASC_REVIEW_ROOT"
