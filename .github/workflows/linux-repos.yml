name: Publish Linux package repositories

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-linux-package-repositories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: desktop-release
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c
          npm ci --ignore-scripts
      - name: Prepare Linux signing
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: bash scripts/prepare-linux-signing.sh packaging/linux-signing-key.asc >> "$GITHUB_ENV"
      - name: Verify releases and build repositories
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PKG_REPO_URL: ${{ vars.PKG_REPO_URL }}
        run: node scripts/package-repos.mjs "$RUNNER_TEMP/pap-repos" "$GITHUB_REPOSITORY" "$PKG_REPO_URL" "$RELEASE_TAG"
      - name: Publish repositories
        env:
          PKG_REPO_R2_ENDPOINT: ${{ vars.PKG_REPO_R2_ENDPOINT }}
          PKG_REPO_R2_BUCKET: ${{ vars.PKG_REPO_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PKG_REPO_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PKG_REPO_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: node scripts/publish-linux-repos.mjs "$RUNNER_TEMP/pap-repos/repo"
      - name: Remove Linux signing material
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/pap-linux-signing/gnupg" --kill gpg-agent || true
          rm -rf -- "$RUNNER_TEMP/pap-linux-signing"
