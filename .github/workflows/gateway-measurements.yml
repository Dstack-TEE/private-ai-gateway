name: Gateway measurements

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gateway-measurements
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true

      - run: uv sync --locked

      - name: Compare release measurements with every live domain
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          uv run --locked python scripts/gateway_measurements.py check 2>&1 | tee "$RUNNER_TEMP/measurements.log"

      - name: Reconcile drift issue
        if: always() && !cancelled()
        uses: actions/github-script@v8
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const repo = context.repo;
            const label = 'measurement-drift';
            const title = 'Gateway measurement drift';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, labels: label, state: 'open', per_page: 100,
            });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (process.env.CHECK_OUTCOME === 'success') {
              if (issue) {
                await github.rest.issues.update({...repo, issue_number: issue.number, state: 'closed'});
              }
              return;
            }
            try {
              await github.rest.issues.getLabel({...repo, name: label});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({...repo, name: label, color: 'B60205'});
            }
            const logPath = path.join(process.env.RUNNER_TEMP, 'measurements.log');
            const log = fs.existsSync(logPath)
              ? fs.readFileSync(logPath, 'utf8').slice(-50000)
              : 'The measurement check did not run. Inspect the workflow setup steps.';
            const run = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const body = `Release/live measurement check failed. [Workflow run](${run})\n\n` +
              '```text\n' + log.replace(/```/g, "''' ") + '\n```';
            if (issue) {
              await github.rest.issues.update({...repo, issue_number: issue.number, body});
            } else {
              await github.rest.issues.create({...repo, title, body, labels: [label]});
            }

      - name: Fail on drift or unavailable evidence
        if: always() && steps.check.outcome != 'success'
        run: exit 1
