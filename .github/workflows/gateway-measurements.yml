name: Gateway measurements

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: gateway-measurements
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.1"
          enable-cache: true

      - run: uv sync --locked

      - name: Compare release measurements with every live domain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/gateway_measurements.py check --summary

  reconcile-issue:
    needs: check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Reconcile drift issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        with:
          script: |
            const repo = context.repo;
            const label = 'measurement-drift';
            const title = 'Gateway measurement drift';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, labels: label, state: 'open', per_page: 100,
            });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (process.env.CHECK_RESULT === 'success') {
              if (issue) {
                await github.rest.issues.update({...repo, issue_number: issue.number, state: 'closed'});
              }
              return;
            }
            try {
              await github.rest.issues.getLabel({...repo, name: label});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({...repo, name: label, color: 'B60205'});
            }
            const run = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const body = `Release/live measurement workflow failed. [Workflow run](${run})`;
            if (issue) {
              await github.rest.issues.update({...repo, issue_number: issue.number, body});
            } else {
              await github.rest.issues.create({...repo, title, body, labels: [label]});
            }
