# Dependabot version updates. `chore(deps)` commits do not bump the desktop
# version or appear in its release-please changelog.
version: 2
updates:
  # Actions are pinned to a commit SHA with a `# vN` comment; Dependabot
  # updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns:
          - "*"

  # Tauri's npm packages and crates must move together: @tauri-apps/api needs
  # the same minor version as the tauri crate. A Dependabot group cannot span
  # the npm and cargo entries, so Tauri is excluded from both and bumped by
  # hand, following
  # https://v2.tauri.app/develop/updating-dependencies/ (npm install
  # @tauri-apps/cli@latest @tauri-apps/api@latest, then the tauri, tauri-build
  # and tauri-plugin-* versions in Cargo.toml and cargo update).
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: "@tauri-apps/*"
    groups:
      desktop-npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /apps/desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: tauri
      - dependency-name: tauri-*
    groups:
      desktop-cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
