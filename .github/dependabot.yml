# Dependabot version updates. `chore(deps)` commits do not bump the desktop
# version or appear in its release-please changelog.
version: 2
updates:
  # Actions are pinned to a commit SHA with a `# vN` comment; Dependabot
  # updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      desktop-npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /apps/desktop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      desktop-cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
