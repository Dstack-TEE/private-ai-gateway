[package]
name = "aci-verifier"
version = "0.1.0"
description = "Relying-party verification of Attested Confidential Inference reports"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.89"
publish = false

[dependencies]
aci-protocol = { path = "../aci-protocol" }
base64 = "0.22"
dcap-qvl = { version = "0.6.3", default-features = false, features = ["std", "report", "rustcrypto"] }
dstack-sdk-types = { version = "0.1.3", default-features = false }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha3 = "0.10"
thiserror = "1"
url = "2"

[dev-dependencies]
ed25519-dalek = "2"
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
unused_must_use = "deny"
