[package]
name = "private-ai-gateway"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the Attested Confidential Inference (ACI) aggregator service"
license = "Apache-2.0"

[workspace]
members = [".", "apps/desktop/aci"]
exclude = [
    "apps/desktop/gateway",
    "apps/desktop/runtime",
    "apps/desktop/src-tauri",
]
resolver = "2"

[lib]
name = "private_ai_gateway"
path = "src/lib.rs"

[[bin]]
name = "private-ai-gateway"
path = "src/main.rs"

[[bin]]
name = "private-ai-proxy"
path = "apps/desktop/cli/main.rs"
required-features = ["desktop-client"]

[[bin]]
name = "private-ai-proxy-service"
path = "apps/desktop/service/main.rs"
required-features = ["desktop-client"]

[features]
desktop-client = ["dep:clap", "dep:desktop_runtime", "dep:desktop_gateway"]

[dependencies]
private-ai-proxy-aci = { path = "apps/desktop/aci" }
desktop_runtime = { package = "private-ai-proxy-runtime", path = "apps/desktop/runtime", optional = true }
desktop_gateway = { package = "private-ai-proxy-gateway", path = "apps/desktop/gateway", optional = true }
# Canonical-JSON, types, and serialization.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
bytes = "1"
rust_decimal = "1"

# Cryptography.
sha2 = "0.10"
sha3 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "ecdh"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
rand = "0.8"
hex = "0.4"
rustls-pemfile = "2"
x509-parser = "0.16"

# HTTP server.
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "io-util", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
# Serving the public entry directly (rather than via axum::serve) is what lets the
# connection IO be wrapped with a write-idle timeout; axum 0.7 takes a concrete
# TcpListener and offers no hook for that. Deliberately NOT hyper-util's
# `server-auto`: it would enable hyper-util/http2, and Cargo unifies features
# crate-wide, so every axum::serve here would start negotiating HTTP/2 — where
# flow control means a stalled reader never blocks the socket write and the
# timeout below could never arm.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
async-stream = "0.3"

# HTTP client (upstream forwarding). Rustls with native roots keeps TLS
# validation normal without linking against system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }

# Errors and logging.
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"

# Async traits used by upstream and verifier abstractions.
async-trait = "0.1"

# Cancellation token for the serve delivery gate.
tokio-util = "0.7"

# Private AI Proxy CLI argument parsing.
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"], optional = true }

[dev-dependencies]
chacha20poly1305 = "0.10"
flate2 = "1"
hkdf = "0.12"
ml-kem = { version = "0.3", features = ["getrandom"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
serde_json = "1"

[lints.rust]
unused_must_use = "deny"
