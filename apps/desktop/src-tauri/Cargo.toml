[package]
name = "private-ai-gateway-desktop"
version = "0.1.0"
description = "Menu bar controller for the ACI local verifying proxy"
authors = ["Dstack-TEE"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "private_ai_gateway_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-shell = "2.3.6"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
