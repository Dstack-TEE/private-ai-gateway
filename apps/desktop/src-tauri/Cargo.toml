[package]
name = "private-ai-gateway-desktop"
version = "0.1.0"
description = "Menu bar controller for the ACI local verifying proxy"
authors = ["Dstack-TEE"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "private_ai_gateway_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
desktop-gateway = { package = "private-ai-gateway-desktop-gateway", path = "../gateway" }
desktop-runtime = { package = "private-ai-gateway-desktop-runtime", path = "../runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-shell = "2.3.6"
tauri-plugin-single-instance = "2.4"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }

[dev-dependencies]
tempfile = "3"
