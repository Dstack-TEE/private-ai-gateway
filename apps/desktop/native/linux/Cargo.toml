[package]
name = "private-ai-gateway-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[[bin]]
name = "private-ai-gateway"
path = "src/main.rs"

[dependencies]
desktop-gateway = { package = "private-ai-gateway-desktop-gateway", path = "../../gateway" }
desktop-runtime = { package = "private-ai-gateway-desktop-runtime", path = "../../runtime" }
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_8"] }
adw = { package = "libadwaita", version = "0.8.0", features = ["v1_2"] }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
