[package]
name = "private-ai-proxy-agent-bridge"
version = "0.2.0-beta.0"
description = "Coding-agent bridge: the loopback Local API proxy, agent tokens, catalog, and agent config projections"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.98"

[lib]
name = "agent_bridge"
path = "src/lib.rs"

[[bin]]
name = "private-ai-proxy-helper"
path = "src/bin/private-ai-proxy-helper.rs"

[dependencies]
desktop-core = { package = "private-ai-proxy-core", path = "../core" }
axum = "0.8"
async-stream = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
futures-util = "0.3"
hex = "0.4"
jsonc-parser = { version = "0.33.1", features = ["serde", "cst"] }
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
shlex = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-util = "0.7"
toml_edit = "0.25"
yaml-edit = { version = "0.3.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
base64 = "0.23"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
# Core's update check enables reqwest's provider-less rustls; tests that build
# clients without the backend's provider setup need the bundled one.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
