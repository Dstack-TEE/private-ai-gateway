[package]
name = "private-ai-proxy-core"
version = "0.2.0-beta.0"
description = "Private AI Proxy client side: contracts, management protocol and client, IPC transport, the settings file and paths"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.98"

[features]
default = []
mac-app-store = ["dep:objc2", "dep:objc2-foundation"]

[lib]
name = "desktop_core"
path = "src/lib.rs"

[dependencies]
fd-lock = "4"
if-addrs = "0.15"
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
schemars = { version = "1", features = ["indexmap2"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_ignored = "0.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ts-rs = "12"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
