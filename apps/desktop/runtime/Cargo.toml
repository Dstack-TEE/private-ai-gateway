[package]
name = "private-ai-gateway-desktop-runtime"
version = "0.1.0"
description = "Platform-neutral state and persistence for Private AI Gateway desktop"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "desktop_runtime"
path = "src/lib.rs"

[dependencies]
desktop-gateway = { package = "private-ai-gateway-desktop-gateway", path = "../gateway" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
