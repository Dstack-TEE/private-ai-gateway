[package]
name = "private-ai-proxy-runtime"
version = "0.1.0"
description = "Platform-neutral state and persistence for Private AI Gateway desktop"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "desktop_runtime"
path = "src/lib.rs"

[dependencies]
axum = "0.7"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tempfile = "3"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
desktop-gateway = { package = "private-ai-proxy-gateway", path = "../gateway" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "signal", "macros"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
netwatcher = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_System_Environment"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
