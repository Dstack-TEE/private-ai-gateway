[package]
name = "private-ai-proxy-runtime"
version = "0.1.0"
description = "Private AI Proxy per-user backend: controller, management server, verifier sessions, usage, account login and web UI"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.98"

[features]
default = []
mac-app-store = ["desktop-core/mac-app-store"]
web-ui = ["dep:async-stream", "dep:futures-core", "dep:rust-embed"]

[lib]
name = "desktop_runtime"
path = "src/lib.rs"

[dependencies]
aci-protocol = { path = "../../../crates/aci-protocol" }
agent-bridge = { package = "private-ai-proxy-agent-bridge", path = "../agent-bridge" }
desktop-core = { package = "private-ai-proxy-core", path = "../core" }
axum = "0.8"
async-stream = { version = "0.3", optional = true }
base64 = "0.23"
futures-core = { version = "0.3", optional = true }
rand = "0.8"
rust-embed = { version = "8", optional = true }
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls-no-provider"] }
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "signal", "macros", "net"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
netwatcher = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
