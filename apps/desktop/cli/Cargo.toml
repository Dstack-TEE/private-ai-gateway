[package]
name = "private-ai-proxy"
version = "0.2.0-beta.0"
description = "Private AI Proxy command-line client and user backend"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.98"

[features]
default = ["web-ui"]
mac-app-store = ["desktop-runtime/mac-app-store"]
# The service-hosted browser UI; App Store builds disable default features to omit it.
web-ui = ["desktop-runtime/web-ui"]

[lib]
name = "private_ai_proxy"
path = "lib.rs"

[[bin]]
name = "private-ai-proxy"
path = "main.rs"

[[bin]]
name = "private-ai-proxy-service"
path = "service.rs"

[dependencies]
aci-protocol = { path = "../../../crates/aci-protocol" }
agent-bridge = { package = "private-ai-proxy-agent-bridge", path = "../agent-bridge" }
async-stream = "0.3"
axum = "0.8"
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dcap-qvl = { version = "0.6.3", default-features = false, features = ["std", "report", "rustcrypto"] }
desktop-core = { package = "private-ai-proxy-core", path = "../core" }
desktop-runtime = { package = "private-ai-proxy-runtime", path = "../runtime" }
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
x509-parser = "0.18"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Environment", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "deny"
