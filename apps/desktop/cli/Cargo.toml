[package]
name = "private-ai-proxy"
version = "0.1.0"
description = "Private AI Proxy command-line client and user backend"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.98"

[features]
default = []
mac-app-store = ["desktop-runtime/mac-app-store"]

[lib]
name = "private_ai_proxy"
path = "lib.rs"

[[bin]]
name = "private-ai-proxy"
path = "main.rs"

[[bin]]
name = "private-ai-proxy-service"
path = "service.rs"

[dependencies]
aci-protocol = { path = "../../../crates/aci-protocol" }
async-stream = "0.3"
axum = "0.7"
base64 = "0.22"
bytes = "1"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
dcap-qvl = { version = "0.3.12", default-features = false, features = ["std", "report", "rustcrypto"] }
desktop-gateway = { package = "private-ai-proxy-gateway", path = "../gateway" }
desktop-runtime = { package = "private-ai-proxy-runtime", path = "../runtime" }
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process", "io-util", "sync", "time"] }
tokio-util = "0.7"
webpki-roots = "1"
x509-parser = "0.16"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "deny"
