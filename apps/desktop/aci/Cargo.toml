[package]
name = "private-ai-proxy-aci"
version = "0.1.0"
description = "ACI protocol, transport, and verification primitives for Private AI Proxy"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.91"

[lib]
name = "private_ai_proxy_aci"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
curve25519-dalek = "4"
dcap-qvl = { version = "0.3.12", default-features = false, features = ["std", "report", "rustcrypto"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic", "ecdh"] }
ml-kem = { version = "0.3", features = ["getrandom"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha3 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "process", "io-util", "sync", "time"] }
webpki-roots = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-parser = "0.16"

[target.'cfg(unix)'.dependencies]
dstack-sdk = "0.1.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints.rust]
unused_must_use = "deny"
